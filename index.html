<style>
:root{
  --bg:#FBF6EE; --card:#FFFFFF; --ink:#2A2522; --muted:#7A6F66; --line:#EADFD0;
  --terra:#C4532D; --terra-soft:#F6E2D8; --sea:#1F5F8B; --sea-soft:#DDEAF3;
  --olive:#5F7A2E; --olive-soft:#E6EDD6; --red:#B3261E; --red-soft:#F7DCDA;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not(.light){--bg:#1B1816; --card:#26221F; --ink:#F3ECE4; --muted:#A99D92; --line:#3A3430;
  --terra:#E07A52; --terra-soft:#3D2A22; --sea:#6FA8D6; --sea-soft:#1F3040;
  --olive:#9DB86A; --olive-soft:#2B3320; --red:#F08B84; --red-soft:#3E2422;
  --shadow:none}
}
:root.dark{--bg:#1B1816; --card:#26221F; --ink:#F3ECE4; --muted:#A99D92; --line:#3A3430;
  --terra:#E07A52; --terra-soft:#3D2A22; --sea:#6FA8D6; --sea-soft:#1F3040;
  --olive:#9DB86A; --olive-soft:#2B3320; --red:#F08B84; --red-soft:#3E2422;
  --shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:22px;letter-spacing:-.01em}
.logo span{color:var(--terra)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--line)}
h1,h2,h3{font-family:Fraunces,serif;font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:28px;line-height:1.15}
h2{font-size:21px;margin:22px 0 10px}
h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;background:var(--terra);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sea{background:var(--sea)}
.btn[disabled]{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--line)}
.pill.ok{background:var(--olive-soft);color:var(--olive)}
.pill.terra{background:var(--terra-soft);color:var(--terra)}
.pill.sea{background:var(--sea-soft);color:var(--sea)}
.hero{display:flex;gap:16px;align-items:center}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-weight:700;font-size:15px;line-height:1.1}
.ring .lbl small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-family:Fraunces,serif}
.stat span{font-size:12px;color:var(--muted)}
.path li{list-style:none;display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.path li:last-child{border-bottom:0}
.path{padding:0;margin:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;font-weight:700}
.chk.done{background:var(--olive);border-color:var(--olive);color:#fff}
.chk.next{border-color:var(--terra);color:var(--terra)}
.link{color:var(--sea);font-weight:600}
.play{width:38px;height:38px;border-radius:50%;background:var(--sea-soft);color:var(--sea);display:grid;place-items:center;flex:none}
.play.slow{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700}
.play.mic{background:var(--terra-soft);color:var(--terra)}
.play.mic.on{background:var(--terra);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.it{font-weight:700;font-size:17px}
.tr{color:var(--terra);font-size:13.5px;font-weight:600}
.ru{color:var(--muted);font-size:14.5px}
.list>.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list>.item:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--shadow)}
.tile b{display:block;font-size:15.5px;margin-bottom:2px}
.tile .em{font-size:22px;display:block;margin-bottom:6px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;margin-bottom:10px;padding:6px 0}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;cursor:pointer;user-select:none}
.flash .big{font-family:Fraunces,serif;font-size:34px;font-weight:700;line-height:1.15}
.flash .hint{font-size:13px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grades button{padding:12px 4px;border-radius:12px;font-weight:700;font-size:14px;line-height:1.2}
.grades small{display:block;font-weight:500;font-size:11px;opacity:.8;margin-top:2px}
.g0{background:var(--red-soft);color:var(--red)}
.g1{background:var(--terra-soft);color:var(--terra)}
.g2{background:var(--olive-soft);color:var(--olive)}
.g3{background:var(--sea-soft);color:var(--sea)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--terra);border-radius:99px;transition:width .3s}
.rule{font-size:15px}
.rule p{margin:8px 0}
.rule table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14.5px}
.rule td{padding:6px 8px;border-bottom:1px solid var(--line)}
.rule td:first-child{color:var(--muted);width:42%}
.rule b{color:var(--terra)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);text-align:left;font-weight:600;font-size:16px}
.opt.right{border-color:var(--olive);background:var(--olive-soft);color:var(--olive)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.q{font-family:Fraunces,serif;font-size:22px;font-weight:700;line-height:1.3}
.explain{margin-top:12px;padding:12px;border-radius:12px;background:var(--sea-soft);color:var(--ink);font-size:14.5px}
.hidden-it .it,.hidden-it .tr{filter:blur(6px);transition:filter .2s}
.hidden-it .item.show .it,.hidden-it .item.show .tr{filter:none}
.ex{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);margin:4px 6px 4px 0}
.ex b{font-size:15px}
.ex span{font-size:12.5px;color:var(--terra);font-weight:600}
.ex .play{width:30px;height:30px}
input[type=search],input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
input[type=range]{width:100%;accent-color:var(--terra)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px}
nav.tabs button.on{color:var(--terra)}
nav.tabs svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:min(92vw,480px);text-align:center;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.setrow{padding:14px 0;border-bottom:1px solid var(--line)}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--olive)}
.switch.on::after{left:21px}
.center{text-align:center}
.mt{margin-top:14px}
.done-big{font-size:46px;line-height:1}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:12px 0}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.bub{max-width:88%;padding:10px 12px;border-radius:16px;margin:8px 0;display:flex;gap:8px;align-items:flex-start;cursor:default}
.bub.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{background:var(--terra-soft);margin-left:auto;border-bottom-right-radius:4px}
.bub.now{outline:2px solid var(--sea);outline-offset:1px}
.bub.hid{cursor:pointer}
.who{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.week{display:flex;gap:8px;height:110px;margin-bottom:8px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.wbar{flex:1;width:100%;background:var(--line);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wbar i{display:block;width:100%;background:var(--terra);opacity:.45;border-radius:8px}
.wbar i.full{opacity:1}
.wcol span{font-size:11px;color:var(--muted)}
.wcol.today span{color:var(--terra);font-weight:700}
.bigplay{width:84px;height:84px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;margin:8px auto}
.bigplay svg{width:34px;height:34px}
.answer-in{font-size:20px;text-align:center;font-weight:700}
.answer-in.right{border-color:var(--olive);background:var(--olive-soft)}
.answer-in.wrong{border-color:var(--red);background:var(--red-soft)}
textarea{width:100%;min-height:90px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:13px/1.4 ui-monospace,monospace}
.celeb{position:fixed;left:50%;top:12px;transform:translate(-50%,-160%);transition:transform .35s cubic-bezier(.2,.9,.3,1.25);z-index:40;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;min-width:260px;max-width:92vw;pointer-events:none}
.celeb.on{transform:translate(-50%,0)}
.celeb .e{font-size:32px;line-height:1}
.conf{position:fixed;top:-14px;width:9px;height:14px;z-index:39;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{top:105vh;transform:rotate(760deg)}}
.awards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.aw{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.aw .e{font-size:30px;display:block;line-height:1.2}
.aw.lock .e{filter:grayscale(1);opacity:.3}
.aw b{display:block;font-size:13px;margin-top:4px}
.aw span{font-size:11px;color:var(--muted);display:block;line-height:1.3}
.quest{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.combo{display:block;margin-top:6px;color:var(--terra);font-weight:800}
.tile[disabled]{opacity:.5}
</style>
</head>

rule:`<p>Мужской род обычно на <b>-o</b>, женский на <b>-a</b>. На <b>-e</b> бывает и тот и другой: il pane (м.), la stazione (ж.). Поэтому учи слова сразу с артиклем.</p>
<table><tr><td>il</td><td>м. р. перед согласной: il treno</td></tr><tr><td>lo</td><td>м. р. перед s+согласная, z, gn, ps: lo studente, lo zaino</td></tr><tr><td>la</td><td>ж. р. перед согласной: la casa</td></tr><tr><td>l'</td><td>перед гласной, любой род: l'amico, l'acqua</td></tr></table>
<p>Неопределённый артикль («какой-то, один»): <b>un</b> (м.), <b>uno</b> (там же, где lo), <b>una</b> (ж.), <b>un'</b> (ж. перед гласной).</p>`,

{id:"g2",t:"essere и avere",ex:[["Sono stanco.","Я устал."],["Sei italiano?","Ты итальянец?"],["Lei è di Messina.","Она из Мессины."],["Siamo studenti.","Мы студенты."],["Ho 23 anni.","Мне 23 года (букв. «имею 23 года»)."],["Hai fame?","Ты голоден?"],["Abbiamo lezione alle nove.","У нас лекция в девять."]],
rule:`<p>Два главных глагола. Местоимение обычно не говорят: «Sono stanco», а не «Io sono stanco».</p>
<table><tr><td>essere — быть</td><td>sono, sei, è, siamo, siete, sono</td></tr><tr><td>avere — иметь</td><td>ho, hai, ha, abbiamo, avete, hanno</td></tr></table>
<p>H не читается: ho = «о», hanno = «Анно». <b>è</b> (есть) с чёрточкой, а <b>e</b> без неё — это «и».</p>
<p>Возраст, голод, жажду и холод итальянцы «имеют»: ho 23 anni, ho fame, ho sete, ho freddo.</p>`,

{id:"g4",t:"Множественное число",ex:[["il libro → i libri","книги"],["la casa → le case","дома"],["lo studente → gli studenti","студенты"],["l'amico → gli amici","друзья"],["la stazione → le stazioni","вокзалы"],["il caffè → i caffè","кофе (мн.)"]],
rule:`<p>Окончания: <b>-o → -i</b>, <b>-a → -e</b>, <b>-e → -i</b>. Слова с ударением на конце и иностранные не меняются: caffè, città, bar, autobus.</p>
<table><tr><td>il →</td><td>i (i libri)</td></tr><tr><td>lo, l' (м.) →</td><td>gli (gli studenti, gli amici)</td></tr><tr><td>la, l' (ж.) →</td><td>le (le case, le amiche)</td></tr></table>`,
q:[["il treno → ___",["i treni","le trene","gli treni"],0,"-o → -i, il → i."],
["la mela → ___",["le mele","i meli","le mela"],0,"-a → -e, la → le."],
["lo zaino → ___",["i zaini","gli zaini","le zaine"],1,"lo → gli."],
["la lezione → ___",["le lezione","le lezioni","i lezioni"],1,"-e → -i, а артикль женский le."],
["il bar → ___",["i bari","i bar","le bar"],1,"Иностранное слово не меняется."],
["l'amica → ___",["gli amici","le amiche","le amice"],1,"Женский род: le amiche (h сохраняет звук «к»)."]]},
{id:"g5",t:"Глаголы на&nbsp;‑ere и&nbsp;‑ire",ex:[["Prendo un caffè.","Я беру кофе."],["Vedi il mare?","Ты видишь море?"],["Dormo poco.","Я мало сплю."],["Parti domani?","Ты уезжаешь завтра?"],["Capisco.","Я понимаю."],["Finiamo alle sei.","Мы заканчиваем в шесть."]],
rule:`<table><tr><td>prendere</td><td>prendo, prendi, prende, prendiamo, prendete, prendono</td></tr><tr><td>dormire</td><td>dormo, dormi, dorme, dormiamo, dormite, dormono</td></tr><tr><td>capire (-isc-)</td><td>capisco, capisci, capisce, capiamo, capite, capiscono</td></tr></table>
<p>Часть глаголов на -ire добавляют <b>-isc-</b>: capire, finire, preferire, pulire. Читается: capisco «капИско», capisci «капИши».</p>`,
q:[["Io ___ l'autobus. (prendere)",["prendo","prende","prendi"],0,"io → -o."],
["Lei ___ fino alle nove. (dormire)",["dormi","dorme","dorma"],1,"lei → -e."],
["Non ___ . (io, capire)",["capo","capisco","capisce"],1,"capire с -isc-: capisco."],
["Voi ___ il treno? (prendere)",["prendete","prendite","prendono"],0,"-ere: voi → -ete."],
["Loro ___ il caffè. (preferire)",["preferono","preferiscono","preferiamo"],1,"-isc- в loro: preferiscono."],
["Noi ___ alle sei. (finire)",["finiamo","finiscono","finite"],0,"В noi -isc- нет: finiamo."]]},
{id:"g6",t:"Отрицание и вопросы",ex:[["Non parlo italiano.","Я не говорю по-итальянски."],["Parli inglese?","Ты говоришь по-английски?"],["Dove abiti?","Где ты живёшь?"],["Quanto costa?","Сколько стоит?"],["Perché? — Perché sono stanco.","Почему? — Потому что я устал."],["Non bevo mai caffè.","Я никогда не пью кофе."]],
rule:`<p>Отрицание: <b>non</b> перед глаголом. Двойное отрицание нормально: Non bevo mai caffè.</p>
<p>Вопрос строится как утверждение, меняется только интонация: голос вверх в конце.</p>
<table><tr><td>chi</td><td>кто</td></tr><tr><td>(che) cosa</td><td>что</td></tr><tr><td>dove</td><td>где, куда</td></tr><tr><td>quando</td><td>когда</td></tr><tr><td>quanto</td><td>сколько</td></tr><tr><td>come</td><td>как</td></tr><tr><td>perché</td><td>почему; потому что</td></tr><tr><td>quale</td><td>какой, который</td></tr></table>`,
q:[["___ costa il biglietto?",["Quanto","Dove","Chi"],0,"Сколько стоит → Quanto."],
["___ è la stazione?",["Quando","Dove","Come"],1,"Где → Dove."],
["___ ti chiami?",["Come","Cosa","Perché"],0,"Как тебя зовут → Come ti chiami."],
["Io ___ parlo tedesco.",["no","non","mai"],1,"Перед глаголом ставим non."],
["___ parte il treno? — Alle dieci.",["Dove","Quando","Chi"],1,"Ответ про время → Quando."],
["Non mangio ___ carne. (никогда)",["mai","niente","no"],0,"никогда → mai."],
["___ è? — È il professore.",["Chi","Che","Quale"],0,"Про человека → Chi."]]},
{id:"g7",t:"C'è и ci sono",ex:[["C'è un supermercato qui vicino?","Здесь рядом есть супермаркет?"],["Ci sono due fermate.","Есть две остановки."],["Non c'è latte.","Молока нет."],["C'è posto?","Есть место?"],["Ci sono problemi?","Есть проблемы?"]],
rule:`<p><b>c'è</b> + единственное число = «есть, имеется». <b>ci sono</b> + множественное.</p>
<p>Отрицание: non c'è, non ci sono. Не путай с è: «È grande» — «он большой», а «C'è» — «имеется».</p>`,
q:[["___ una farmacia qui?",["C'è","Ci sono","È"],0,"Одна аптека → c'è."],
["___ molti studenti.",["C'è","Ci sono","Sono"],1,"Много студентов → ci sono."],
["Non ___ pane.",["ci sono","c'è","è"],1,"Хлеб — единственное число."],
["___ due bagni in casa.",["Ci sono","C'è","Ha"],0,"Две ванные → ci sono."],
["Scusi, ___ un bancomat vicino?",["ci sono","c'è","è"],1,"Один банкомат → c'è."]]},
{id:"g8",t:"andare, fare, volere, potere",ex:[["Vado all'università.","Я иду в университет."],["Andiamo al mare?","Пойдём на море?"],["Faccio la spesa.","Я делаю покупки."],["Che cosa fai?","Что ты делаешь?"],["Vorrei un caffè.","Я бы хотел кофе (вежливо)."],["Posso pagare con la carta?","Можно картой?"],["Devo andare.","Мне надо идти."]],
rule:`<p>Самые нужные неправильные глаголы, их просто запоминаешь:</p>
<table><tr><td>andare</td><td>vado, vai, va, andiamo, andate, vanno</td></tr><tr><td>fare</td><td>faccio, fai, fa, facciamo, fate, fanno</td></tr><tr><td>volere</td><td>voglio, vuoi, vuole, vogliamo, volete, vogliono</td></tr><tr><td>potere</td><td>posso, puoi, può, possiamo, potete, possono</td></tr><tr><td>dovere</td><td>devo, devi, deve, dobbiamo, dovete, devono</td></tr></table>
<p>После volere, potere, dovere идёт инфинитив: Posso entrare? Devo andare. В кафе и магазине вместо voglio говори вежливое <b>vorrei</b> — «я бы хотел».</p>`,
q:[["Io ___ a casa. (andare)",["ando","vado","va"],1,"andare неправильный: vado."],
["Che cosa ___ stasera? (tu, fare)",["fai","fa","faci"],0,"tu → fai."],
["___ pagare con la carta? (io, potere)",["Poto","Posso","Può"],1,"io → posso."],
["Noi ___ al mare. (andare)",["andiamo","vanno","andate"],0,"noi → andiamo."],
["Loro ___ un gelato. (volere)",["vogliono","volono","vuole"],0,"loro → vogliono."],
["Lei ___ lavorare domani. (dovere)",["deve","dove","devi"],0,"lei → deve. dove — это «где»."],
["___ un cappuccino, per favore. (вежливо)",["Voglio","Vorrei","Vuole"],1,"Вежливо → vorrei."]]},
{id:"g9",t:"Mi piace",ex:[["Mi piace il caffè.","Мне нравится кофе."],["Mi piace Messina.","Мне нравится Мессина."],["Mi piacciono gli arancini.","Мне нравятся аранчини."],["Ti piace la pizza?","Тебе нравится пицца?"],["Non mi piace il freddo.","Я не люблю холод."],["Mi piace studiare.","Мне нравится учиться."]],
rule:`<p>Строится как в русском «мне нравится». Одна вещь или действие → <b>piace</b>, несколько вещей → <b>piacciono</b>.</p>
<table><tr><td>mi</td><td>мне</td></tr><tr><td>ti</td><td>тебе</td></tr><tr><td>gli / le</td><td>ему / ей (le — и вежливое «Вам»)</td></tr><tr><td>ci</td><td>нам</td></tr><tr><td>vi</td><td>вам</td></tr><tr><td>gli</td><td>им</td></tr></table>
<p>Артикль нужен: Mi piace <b>il</b> mare.</p>`,
q:[["Mi ___ la granita.",["piace","piacciono","piaccio"],0,"Одна вещь → piace."],
["Mi ___ i cannoli.",["piace","piacciono","piaci"],1,"Несколько → piacciono."],
["___ piace il mare? (тебе)",["Ti","Tu","Mi"],0,"тебе → ti."],
["Non mi piace ___ freddo.",["il","lo","la"],0,"freddo — м. р., согласная → il."],
["Ci ___ viaggiare.",["piacciono","piace","piacere"],1,"Действие (инфинитив) → piace."]]},
{id:"g10",t:"Предлоги a, in, di, da",ex:[["Abito a Messina.","Я живу в Мессине."],["Studio in Italia.","Я учусь в Италии."],["Vado in farmacia.","Я иду в аптеку."],["Sono di Almaty.","Я из Алматы."],["Vengo da Roma.","Я еду из Рима."],["Vado dal medico.","Я иду к врачу."],["Il treno per Palermo.","Поезд на Палермо."],["Esco con gli amici.","Я гуляю с друзьями."]],
rule:`<table><tr><td>a</td><td>города и «куда»: a Messina, a casa, a lezione</td></tr><tr><td>in</td><td>страны, регионы, многие места: in Italia, in Sicilia, in centro, in banca, in farmacia</td></tr><tr><td>di</td><td>чей и откуда родом: il libro di Marco, sono di Almaty</td></tr><tr><td>da</td><td>откуда: vengo da Roma; к человеку: vado dal medico</td></tr><tr><td>con</td><td>с: con gli amici</td></tr><tr><td>per</td><td>для; направление поезда: per Palermo</td></tr></table>
<p>«Sono <b>di</b> Almaty» — я родом из Алматы. «Vengo <b>da</b> Almaty» — я еду (прилетел) из Алматы.</p>`,
q:[["Abito ___ Messina.",["a","in","di"],0,"Город → a."],
["Studio ___ Italia.",["a","in","da"],1,"Страна → in."],
["Sono ___ Almaty.",["di","da","a"],0,"Откуда родом → essere di."],
["Vado ___ farmacia.",["a","in","di"],1,"Аптека, банк, центр → in."],
["Il treno ___ Catania.",["per","con","di"],0,"Направление поезда → per."],
["Vengo ___ Roma.",["di","da","in"],1,"Откуда еду → da."],
["Esco ___ i miei amici.",["con","per","da"],0,"с друзьями → con."]]},
{id:"g11",t:"Предлоги с артиклями",ex:[["Vado al mare.","Я иду на море. (a + il)"],["Vado all'università.","Я иду в университет. (a + l')"],["Il libro è sul tavolo.","Книга на столе. (su + il)"],["Le chiavi sono nella borsa.","Ключи в сумке. (in + la)"],["Torno dalla stazione.","Я возвращаюсь с вокзала. (da + la)"],["Il nome del professore.","Имя преподавателя. (di + il)"]],
rule:`<p>Предлоги a, di, da, in, su сливаются с артиклем в одно слово:</p>
<table><tr><td>a +</td><td>al, allo, alla, all', ai, agli, alle</td></tr><tr><td>di +</td><td>del, dello, della, dell', dei, degli, delle</td></tr><tr><td>da +</td><td>dal, dallo, dalla, dall', dai, dagli, dalle</td></tr><tr><td>in +</td><td>nel, nello, nella, nell', nei, negli, nelle</td></tr><tr><td>su +</td><td>sul, sullo, sulla, sull', sui, sugli, sulle</td></tr></table>
<p>Порядок в строке всегда тот же: il, lo, la, l', i, gli, le. С con и per не сливаются.</p>`,
q:[["Vado ___ mare. (a + il)",["al","alla","allo"],0,"a + il = al."],
["Le chiavi sono ___ borsa. (in + la)",["nel","nella","nello"],1,"in + la = nella."],
["Il libro è ___ tavolo. (su + il)",["sul","sulla","sullo"],0,"su + il = sul."],
["Torno ___ stazione. (da + la)",["dal","dalla","dalle"],1,"da + la = dalla."],
["Il nome ___ professore. (di + il)",["del","dello","della"],0,"di + il = del."],
["Vado ___ università. (a + l')",["all'","al","alla"],0,"a + l' = all'."],
["Parlo ___ studenti. (a + gli)",["ai","agli","alle"],1,"a + gli = agli."]]},
{id:"g12",t:"Мой, твой, наш",ex:[["il mio telefono","мой телефон"],["la mia casa","мой дом"],["i miei amici","мои друзья"],["le mie chiavi","мои ключи"],["mia moglie","моя жена (без артикля)"],["tuo fratello","твой брат"],["il nostro professore","наш преподаватель"],["Com'è la tua città?","Какой у тебя город?"]],
rule:`<table><tr><td>мой</td><td>mio, mia, miei, mie</td></tr><tr><td>твой</td><td>tuo, tua, tuoi, tue</td></tr><tr><td>его, её, Ваш</td><td>suo, sua, suoi, sue</td></tr><tr><td>наш</td><td>nostro, nostra, nostri, nostre</td></tr><tr><td>ваш</td><td>vostro, vostra, vostri, vostre</td></tr><tr><td>их</td><td>loro (не меняется)</td></tr></table>
<p>Обычно с артиклем: <b>il</b> mio libro. С родственниками в единственном числе артикль не ставят: mia moglie, mio padre. Но: i miei genitori, il loro figlio.</p>
<p>Род берётся от предмета, а не от владельца: suo libro — и «его», и «её» книга.</p>`,
q:[["___ casa è piccola. (моя)",["Il mio","La mia","Mia"],1,"casa — ж. р., с артиклем: la mia casa."],
["Ecco ___ chiavi. (мои)",["le mie","i miei","la mia"],0,"chiavi — ж. р., мн. ч."],
["___ moglie è di Almaty. (моя)",["La mia","Mia","Il mio"],1,"Родственник в ед. ч. → без артикля."],
["Dov'è ___ telefono? (твой)",["il tuo","la tua","tuo"],0,"telefono — м. р."],
["___ amici sono italiani. (наши)",["I nostri","Le nostre","Nostri"],0,"amici — м. р., мн. ч., с артиклем."],
["Come si chiama ___ figlio? (их)",["il loro","loro","il suoi"],0,"loro всегда с артиклем, даже с родственниками."]]},
{id:"g13",t:"Возвратные глаголы",ex:[["Mi chiamo Yera.","Меня зовут Ера."],["Come ti chiami?","Как тебя зовут?"],["Si chiama Giulia.","Её зовут Джулия."],["Mi sveglio alle sette.","Я просыпаюсь в семь."],["Mi alzo presto.","Я встаю рано."],["Ci vediamo domani!","Увидимся завтра!"],["Mi trovo bene a Messina.","Мне хорошо в Мессине."]],
rule:`<p>Это глаголы с частицей «-ся». Частица стоит перед глаголом:</p>
<table><tr><td>io</td><td><b>mi</b> chiamo</td></tr><tr><td>tu</td><td><b>ti</b> chiami</td></tr><tr><td>lui / lei</td><td><b>si</b> chiama</td></tr><tr><td>noi</td><td><b>ci</b> chiamiamo</td></tr><tr><td>voi</td><td><b>vi</b> chiamate</td></tr><tr><td>loro</td><td><b>si</b> chiamano</td></tr></table>
<p>Частые: svegliarsi (просыпаться), alzarsi (вставать), vestirsi (одеваться), sentirsi (чувствовать себя), trovarsi (находиться, «как тебе там»).</p>`,
q:[["Io ___ chiamo Anna.",["mi","ti","si"],0,"io → mi."],
["Come ___ chiami?",["ti","si","mi"],0,"tu → ti."],
["Lei ___ sveglia presto.",["si","mi","ci"],0,"lei → si."],
["Noi ___ vediamo domani.",["ci","vi","si"],0,"noi → ci."],
["Voi ___ alzate tardi?",["vi","ci","si"],0,"voi → vi."],
["Come ti ___ oggi? (sentirsi)",["senti","sente","sento"],0,"tu → senti: Come ti senti?"]]},
{id:"g14",t:"Прошедшее время с avere",ex:[["Ho mangiato una granita.","Я съел гранита."],["Hai capito?","Ты понял?"],["Abbiamo comprato il pane.","Мы купили хлеб."],["Ieri ho lavorato tanto.","Вчера я много работал."],["Hai fatto la spesa?","Ты сходил за продуктами?"],["Ho preso il treno.","Я сел на поезд."]],
rule:`<p>Passato prossimo = <b>avere</b> в настоящем + причастие. Это главное прошедшее время в разговоре.</p>
<table><tr><td>-are → -ato</td><td>mangiare → mangiato</td></tr><tr><td>-ere → -uto</td><td>vendere → venduto</td></tr><tr><td>-ire → -ito</td><td>capire → capito</td></tr></table>
<p>Неправильные, их нужно запомнить: fare → <b>fatto</b>, prendere → <b>preso</b>, vedere → <b>visto</b>, leggere → <b>letto</b>, scrivere → <b>scritto</b>, bere → <b>bevuto</b>, aprire → <b>aperto</b>, chiudere → <b>chiuso</b>, perdere → <b>perso</b>.</p>`,
q:[["Ieri ___ mangiato la pizza. (io)",["ho","ha","sono"],0,"io → ho."],
["Hai ___ la lezione? (capire)",["capato","capito","capiuto"],1,"-ire → -ito."],
["Noi abbiamo ___ il treno. (prendere)",["prenduto","preso","prendato"],1,"prendere → preso (неправильный)."],
["Che cosa hai ___ ieri? (fare)",["fatto","fato","fauto"],0,"fare → fatto."],
["Loro ___ comprato il latte.",["hanno","abbiamo","sono"],0,"loro → hanno."],
["Ho ___ il portafoglio. (perdere)",["perso","perdito","persato"],0,"perdere → perso."],
["Avete ___ il film? (vedere)",["visto","vedito","vistato"],0,"vedere → visto."]]},
{id:"g15",t:"Прошедшее время с essere",ex:[["Sono andato al mare.","Я ходил на море. (м.)"],["Sei arrivata ieri?","Ты приехала вчера?"],["È uscito alle otto.","Он вышел в восемь."],["Siamo tornati a casa.","Мы вернулись домой."],["Lei è nata ad Almaty.","Она родилась в Алматы."],["Mi sono svegliato tardi.","Я проснулся поздно."]],
rule:`<p>Глаголы движения и состояния идут с <b>essere</b>: andare, venire, arrivare, partire, tornare, uscire, entrare, restare, nascere. С essere идут и все возвратные: mi sono svegliato.</p>
<p>Причастие согласуется с тем, кто действует, как прилагательное:</p>
<table><tr><td>он</td><td>andat<b>o</b></td></tr><tr><td>она</td><td>andat<b>a</b></td></tr><tr><td>они (м. или смешанные)</td><td>andat<b>i</b></td></tr><tr><td>они (ж.)</td><td>andat<b>e</b></td></tr></table>
<p>Неправильные: venire → venuto, nascere → nato, essere → stato, rimanere → rimasto.</p>`,
q:[["Ieri ___ andato in centro. (я)",["ho","sono","è"],1,"andare → с essere."],
["Giulia è ___ alle sei. (arrivare)",["arrivato","arrivata","arrivati"],1,"Giulia — женщина → arrivata."],
["Noi ___ tornati tardi.",["siamo","abbiamo","sono"],0,"tornare с essere, noi → siamo."],
["Marco ___ uscito.",["ha","è","sei"],1,"uscire → с essere."],
["Le ragazze sono ___ al mare. (andare)",["andati","andate","andata"],1,"Девушки, мн. ч. ж. р. → andate."],
["Io ___ mangiato bene.",["sono","ho","è"],1,"mangiare не глагол движения → avere."],
["Mi ___ svegliato tardi.",["ho","sono","è"],1,"Возвратный → essere: mi sono svegliato."]]},
{id:"g16",t:"Который час?",ex:[["Che ore sono?","Который час?"],["Sono le tre.","Три часа."],["È l'una.","Час."],["Sono le otto e mezza.","Половина девятого (8:30)."],["Sono le dieci e un quarto.","Четверть одиннадцатого (10:15)."],["Sono le nove meno un quarto.","Без четверти девять (8:45)."],["È mezzogiorno.","Полдень."],["A che ora? — Alle nove.","Во сколько? — В девять."]],
rule:`<p>Часы — это «le ore», поэтому множественное: <b>Sono le</b> due, sono le tre. Исключения в единственном: <b>è l'una</b>, è mezzogiorno, è mezzanotte.</p>
<table><tr><td>e mezza</td><td>половина: le otto e mezza = 8:30</td></tr><tr><td>e un quarto</td><td>четверть: 10:15</td></tr><tr><td>meno un quarto</td><td>без четверти: le nove meno un quarto = 8:45</td></tr><tr><td>e venti</td><td>минуты просто прибавляем: 7:20 = le sette e venti</td></tr></table>
<p>«Во сколько?» — <b>A che ora?</b> Ответ: alle nove, all'una.</p>`,
q:[["___ le quattro.",["È","Sono","Ci sono"],1,"Часы во множественном → sono le."],
["È ___ una.",["la","l'","le"],1,"È l'una — единственное исключение."],

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

function startSession(custom){
  if(Array.isArray(custom)){sess={queue:custom.slice(),total:custom.length,done:0,flipped:false,dir:"it",cur:null};nextCard();return}
  const now=Date.now();
  const due=Object.entries(state.cards).filter(([id,c])=>c.due<=now&&cardById(id)).sort((a,b)=>a[1].due-b[1].due).map(([id])=>id);
  const fr=freshIds(newLeft());
  const q=[];let i=0,j=0;
  while(i<due.length||j<fr.length){if(i<due.length)q.push(due[i++]);if(i<due.length)q.push(due[i++]);if(j<fr.length)q.push(fr[j++])}

function grade(g){
  const id=sess.cur; let c=state.cards[id]; const isNew=!c;
  if(!c)c={ease:2.5,iv:0,reps:0,due:0,lapses:0};
  if(g===0){c.reps=0;c.lapses++;c.ease=Math.max(1.3,c.ease-.2);c.iv=0;c.due=Date.now()+60e3;sess.queue.splice(Math.min(3,sess.queue.length),0,id)}
  else{
    if(g===1){c.iv=c.reps===0?1:Math.max(1,Math.round(c.iv*1.2));c.ease=Math.max(1.3,c.ease-.15)}
    else if(g===2){c.iv=c.reps===0?1:c.reps===1?3:Math.round(c.iv*c.ease)}
    else{c.iv=c.reps===0?3:Math.round(Math.max(c.iv,1)*c.ease*1.3);c.ease+=.15}

let seqTimer=null;
function openDialog(id){
  dlg={id,role:false,shown:{},playing:false,cur:null};

  render();window.scrollTo(0,0);
}
function vDialog(){
  const d=DIALOGS.find(x=>x.id===dlg.id);

  <div class="mt">${d.l.map((l,i)=>{const me=l[0]===1;const hid=me&&dlg.role&&!dlg.shown[i];
    return `<div class="bub ${me?"me":"them"} ${dlg.cur===i?"now":""} ${hid?"hid":""}" ${hid?`data-line="${i}"`:""}><div class="grow"><div class="who">${me?"Ты":esc(d.who)}</div>

    :`<div class="it" style="font-size:16px">${esc(l[1])}</div><div class="ru">${esc(l[2])}</div>`}</div>${hid?"":`<button class="play" data-say="${esc(l[1])}" aria-label="Слушать">${ICON.play}</button>`}</div>`}).join("")}</div>
  ${dlg.role?`<p class="muted small">При прослушивании на твоей реплике будет пауза 4 секунды, чтобы ты успел сказать её сам.</p>`:""}`;
}
function speakU(text,opt){
  opt=opt||{};
  try{
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang="it-IT";if(itVoice)u.voice=itVoice;u.rate=state.settings.rate;u.pitch=opt.pitch||1;
    if(opt.onend){u.onend=opt.onend;u.onerror=opt.onend}
    speechSynthesis.speak(u);
  }catch(e){if(opt.onend)setTimeout(opt.onend,1500)}
}
function playDialog(i){
  if(!dlg||!dlg.playing)return;
  const d=DIALOGS.find(x=>x.id===dlg.id);
  if(i>=d.l.length){
    dlg.playing=false;dlg.cur=null;
    bump("dialog");if((state.dialogs[dlg.id]||0)<2){state.dialogs[dlg.id]=2;addXP(3)}else save();
    render();return;
  }
  dlg.cur=i;render();
  const l=d.l[i];
  if(dlg.role&&l[0]===1&&!dlg.shown[i]){
    seqTimer=setTimeout(()=>{if(!dlg||!dlg.playing)return;dlg.shown[i]=true;render();speakU(l[1],{onend:()=>{seqTimer=setTimeout(()=>playDialog(i+1),350)}})},4000);
    return;
  }
  speakU(l[1],{pitch:l[0]===1?1.05:0.9,onend:()=>{seqTimer=setTimeout(()=>playDialog(i+1),350)}});
}
function stopDialog(){
  clearTimeout(seqTimer);
  if(dlg&&dlg.playing){dlg.playing=false;dlg.cur=null;try{speechSynthesis.cancel()}catch(e){}}
}

/* ================== PRACTICE ================== */
const NU=["zero","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci","undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove"];
const NT=["","","venti","trenta","quaranta","cinquanta","sessanta","settanta","ottanta","novanta"];
function n100(n){if(n<20)return NU[n];const t=Math.floor(n/10),u=n%10;let s=NT[t];if(!u)return s;if(u===1||u===8)s=s.slice(0,-1);return s+NU[u]}
function n1000(n){if(n<100)return n100(n);const h=Math.floor(n/100),r=n%100;let s=h===1?"cento":NU[h]+"cento";if(!r)return s;if(Math.floor(r/10)===8)s=s.slice(0,-1);return s+n100(r)}
function numIt(n){let s;if(n<1000)s=n1000(n);else{const k=Math.floor(n/1000),r=n%1000;s=(k===1?"mille":n1000(k)+"mila")+(r?n1000(r):"")}return s.length>3&&s.endsWith("tre")?s.slice(0,-3)+"tré":s}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pad2=n=>String(n).padStart(2,"0");
function timeIt(h,m){
  let hh=h,suffix="";
  if(m===15)suffix=" e un quarto";else if(m===30)suffix=" e mezza";else if(m===45){hh=h%12+1;suffix=" meno un quarto"}else if(m)suffix=" e "+numIt(m);
  if(hh===1)return "È l'una"+suffix;
  if(hh===12&&!m)return "È mezzogiorno";
  return "Sono le "+numIt(hh)+suffix;
}
const LEVELS=[["n20","0–20","числа до двадцати"],["n100","21–100","десятки и составные"],["n1000","100–999","сотни"],["price","Цены в €","«tre euro e cinquanta»"],["time","Время","«sono le otto e mezza»"]];
function genNum(level){
  if(level==="price"){const e=rnd(1,25),c=pick([0,0,10,20,30,40,50,50,60,70,80,90,99]);return{val:e+c/100,ans:e+(c?","+pad2(c):"")+" €",say:(e===1?"un euro":numIt(e)+" euro")+(c?" e "+numIt(c):"")}}
  if(level==="time"){const h=rnd(1,12),m=pick([0,0,5,10,15,20,30,30,40,45,50]);return{h,m,ans:h+":"+pad2(m),say:timeIt(h,m)}}
  const [a,b]=level==="n20"?[0,20]:level==="n100"?[21,100]:[100,999];
  const n=rnd(a,b);return{val:n,ans:String(n),say:numIt(n)};
}
function checkNum(level,inp,it){
  if(level==="price"){const v=parseFloat(inp.replace(",",".").replace(/[^\d.]/g,""));return !isNaN(v)&&Math.abs(v-it.val)<0.001}
  if(level==="time"){const m=inp.match(/(\d{1,2})\D*(\d{2})?/);if(!m)return false;return (+m[1])%12===it.h%12&&(+(m[2]||0))===it.m}
  const v=parseInt(inp.replace(/\D/g,""),10);return v===it.val;
}
function practicePool(){
  let p=WORDS.filter(w=>{const c=state.cards["w:"+w[0]];return c&&c.reps>0});
  if(p.length<12){const ex=shuffle(WORDS.filter(w=>["base","num","food","city"].includes(w[3])&&!p.includes(w)));p=p.concat(ex.slice(0,30-p.length))}
  return p;
}
function stripArt(s){return s.trim().replace(/^(l'|un')\s*/i,"").replace(/^(il|lo|la|i|gli|le|un|uno|una)\s+/i,"")}
function hardIds(){return Object.entries(state.cards).filter(([id,c])=>c.lapses>=1&&cardById(id)).sort((a,b)=>b[1].lapses-a[1].lapses).slice(0,20).map(([id])=>id)}
function startPractice(mode,level){
  let items;
  if(mode==="listen"){const pool=practicePool();items=shuffle(pool.slice()).slice(0,10).map(w=>{const others=shuffle(WORDS.filter(x=>x[1]!==w[1])).slice(0,3).map(x=>x[1]);return{w,opts:shuffle([w[1]].concat(others))}})}
  else if(mode==="write"){items=shuffle(practicePool().slice()).slice(0,10).map(w=>({w}))}
  else items=[...Array(10)].map(()=>genNum(level));
  prac={mode,level:level||null,items,i:0,correct:0,answered:null,input:""};
  render();window.scrollTo(0,0);sayCurrent();
}
function sayCurrent(){
  if(!prac||!prac.items||prac.i>=prac.items.length)return;
  const it=prac.items[prac.i];
  if(prac.mode==="listen")setTimeout(()=>speak(it.w[0]),250);
  if(prac.mode==="numbers")setTimeout(()=>speak(it.say),250);
}
function answerPractice(val){
  const it=prac.items[prac.i];let ok=false,near=false;
  if(prac.mode==="listen")ok=val===it.w[1];
  else if(prac.mode==="write"){
    const a=norm(val),b=norm(it.w[0]),a2=norm(stripArt(val)),b2=norm(stripArt(it.w[0]));
    ok=a===b||a2===b2;
    if(!ok&&b2.length>4&&lev(a2,b2)===1){ok=true;near=true}
  }else ok=checkNum(prac.level,val,it);
  prac.answered={val,ok,near};comboHit(prac,ok);
  if(ok){prac.correct++;bump("correct");addXP(2);tgHaptic("success")}else{tgHaptic("error");save()}
  if(prac.mode==="write"||prac.mode==="listen")speak(it.w[0]);
  render();
}

  <button class="bigplay" data-say="${esc(it.say)}" aria-label="Слушать">${ICON.play}</button>
  <button class="link small" data-say="${esc(it.say)}" data-slow="1">Медленнее</button>
  <input type="text" id="pin" inputmode="${prac.level==="time"?"text":"decimal"}" class="answer-in mt ${a?(a.ok?"right":"wrong"):""}" autocomplete="off" placeholder="${prac.level==="price"?"например 4,50":prac.level==="time"?"например 8:30":"число"}" value="${esc(a?a.val:prac.input)}" ${a?"readonly":""}>
  ${a?`<div class="explain" style="text-align:left">${a.ok?"<b>Giusto!</b> ":"<b>Было:</b> "}${esc(it.ans)} — <i>${esc(it.say)}</i>${comboTag(prac)}</div><button class="btn block mt" id="pnext">${prac.i+1<N?"Дальше":"Результат"}</button>`
  :`<div class="row mt"><button class="btn ghost" id="pskip">Не знаю</button><button class="btn grow" id="pcheck">Проверить</button></div>`}</div>`;
}

/* ================== SETTINGS ================== */
function encodeState(){return "PP1:"+btoa(unescape(encodeURIComponent(JSON.stringify(state))))}
function decodeState(code){code=code.trim();const raw=code.startsWith("PP1:")?decodeURIComponent(escape(atob(code.slice(4)))):code;const o=JSON.parse(raw);if(!o||typeof o!=="object"||typeof o.cards!=="object")throw new Error("bad");return o}
function openSettings(){
  const s=state.settings;
  $("#sheet").innerHTML=`<div class="row between"><h2 style="margin:0">Настройки</h2><button class="iconbtn" id="closeM" aria-label="Закрыть">✕</button></div>
  <div class="setrow"><div class="row between"><b>Скорость озвучки</b><span class="muted" id="rateV">${s.rate.toFixed(1)}×</span></div><input type="range" min="0.5" max="1.2" step="0.1" value="${s.rate}" id="rate"><button class="link small" data-say="Ciao, come stai? Mi chiamo Yera.">Проверить голос</button></div>
  <div class="setrow"><div class="row between"><b>Новых слов в день</b><span class="muted" id="npdV">${s.newPerDay}</span></div><input type="range" min="3" max="30" step="1" value="${s.newPerDay}" id="npd"></div>
  <div class="setrow"><div class="row between"><b>Цель дня (очков)</b><span class="muted" id="goalV">${s.goal}</span></div><input type="range" min="10" max="100" step="5" value="${s.goal}" id="goal"></div>
  <div class="setrow row between"><div><b>Автоозвучка карточек</b><div class="muted small">Произносить слово при показе</div></div><button class="switch ${s.autoSpeak?"on":""}" id="auto"></button></div>
  <div class="setrow"><b>Сохранение прогресса</b><div class="muted small">${syncMode==="tg"?"Хранится в твоём Telegram-аккаунте: одинаковый прогресс на телефоне и компьютере.":syncMode==="cloud"?"Синхронизируется с твоим аккаунтом Claude: одинаковый прогресс на телефоне и компьютере.":"Хранится в этом браузере. Если очистить данные браузера, прогресс пропадёт."}</div>
  <div class="muted small" style="margin-top:4px">Голос: ${itVoice?esc(itVoice.name):"итальянский голос не найден"}</div></div>
  ${TG?`<div class="setrow"><b>Напоминания</b><div class="muted small">Настраиваются в чате с ботом: /time 9 — час напоминания, /remind — включить или выключить.</div></div>`:""}
  <div class="setrow"><b>Перенос прогресса</b><div class="muted small">Код со всем прогрессом. Пригодится, чтобы перенести его в Telegram-версию или другой браузер.</div>
  <div class="row mt" style="gap:8px"><button class="btn ghost grow" id="exportBtn">Скопировать код</button><button class="btn ghost grow" id="importBtn">Вставить код</button></div><div id="xfer"></div></div>
  <div class="setrow"><button class="btn ghost block" id="reset" style="color:var(--red)">Сбросить весь прогресс</button></div>`;
  $("#modal").classList.add("on");
}
function confirmReset(){
  $("#sheet").innerHTML=`<h2 style="margin-top:0">Сбросить прогресс?</h2><p class="muted">Карточки, уроки, очки и серия удалятся. Отменить будет нельзя.</p>
  <div class="row mt"><button class="btn ghost grow" id="closeM">Отмена</button><button class="btn grow" id="doReset" style="background:var(--red)">Сбросить</button></div>`;
}

/* ================== RENDER & EVENTS ================== */
function render(){
  const app=$("#app");
  app.innerHTML=view==="today"?vToday():view==="words"?vWords():view==="phrases"?vPhrases():view==="grammar"?vGrammar():vPractice();
  {const L=levelOf(totalXP());$("#lvchip").textContent="⭐ Ур. "+L;}
  $("#tabs").innerHTML=TABS.map(t=>`<button class="${view===t[0]?"on":""}" data-tab="${t[0]}">${t[2]}<span>${t[1]}</span></button>`).join("");
  if(view==="practice"&&prac&&prac.items&&!prac.answered&&(prac.mode==="write"||prac.mode==="numbers")){const p=$("#pin");if(p&&document.activeElement!==p)try{p.focus({preventScroll:true})}catch(e){}}
}
function refocus(id,val){const pos=val.length;render();const n=$("#"+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-reveal],[data-line]"); if(!t)return;
  const d=t.dataset;
  if(d.say!==undefined){speak(d.say,!!d.slow);if(d.sound&&!state.sounds[d.sound]){state.sounds[d.sound]=1;addXP(1);setTimeout(render,50)}e.stopPropagation();return}
  if(d.listen!==undefined){listen(d.listen,t);e.stopPropagation();return}
  if(d.tab){go(d.tab);return}
  if(d.step!==undefined){window._steps[+d.step][3]();return}
  if(d.topic){const k=d.topic,a=state.settings.topics;const i=a.indexOf(k);if(i>=0){if(a.length>1)a.splice(i,1);else toast("Нужна хотя бы одна тема")}else a.push(k);save();render();return}
  if(d.seg){phMode=d.seg;sub=null;render();return}
  if(d.ph){sub=d.ph;hideIt=false;render();window.scrollTo(0,0);return}
  if(d.dlg){openDialog(d.dlg);return}
  if(d.line!==undefined&&dlg){dlg.shown[+d.line]=true;render();return}
  if(d.addph!==undefined){addPhraseCard(d.addph);e.stopPropagation();return}
  if(d.reveal!==undefined&&hideIt){t.classList.toggle("show");return}
  if(d.lesson){openLesson(d.lesson);return}
  if(d.opt!==undefined&&les&&les.answered===null){const L=LESSONS.find(l=>l.id===les.id);const q=L.q[les.qi];les.answered=+d.opt;const ok=+d.opt===q[2];comboHit(les,ok);if(ok){les.correct++;bump("correct");addXP(2);tgHaptic("success")}else{tgHaptic("error");save()}render();return}
  if(d.g!==undefined){grade(+d.g);return}
  if(d.prac){
    if(d.prac==="sounds"){prac={mode:"sounds"};render();window.scrollTo(0,0)}
    else if(d.prac==="numbers"){prac={mode:"numbers",level:null};render()}
    else if(d.prac==="hard"){const ids=hardIds();if(ids.length){go("words");startSession(ids);wordsMode="session";render()}}
    else startPractice(d.prac);
    return;
  }
  if(d.level){startPractice("numbers",d.level);return}
  if(d.popt!==undefined&&prac&&!prac.answered){answerPractice(d.popt);return}
  switch(t.id){
    case "startCards":go("words");startSession();wordsMode="session";render();break;
    case "showAns":sess.flipped=true;render();if(sess.dir==="ru"&&state.settings.autoSpeak)speak(cardById(sess.cur).it);break;
    case "quitSess":case "endSess":sess=null;wordsMode="home";render();break;
    case "openDict":wordsMode="dict";render();break;
    case "dictBack":wordsMode="home";search="";render();break;
    case "phBack":sub=null;render();break;
    case "hideIt":hideIt=!hideIt;render();break;
    case "dlgBack":stopDialog();dlg=null;render();break;
    case "roleMode":dlg.role=!dlg.role;dlg.shown={};render();break;
    case "playAll":speechSynthesis&&speechSynthesis.cancel();dlg.playing=true;if(dlg.role)dlg.shown={};playDialog(0);break;
    case "stopAll":stopDialog();render();break;
    case "lesBack":les=null;render();window.scrollTo(0,0);break;
    case "startQuiz":les.step="quiz";les.qi=0;les.correct=0;les.answered=null;les.order=null;render();window.scrollTo(0,0);break;
    case "nextQ":{const L=LESSONS.find(l=>l.id===les.id);les.answered=null;les.order=null;
      if(les.qi+1<L.q.length)les.qi++;else{les.step="done";const pct=Math.round(100*les.correct/L.q.length);if(pct>=70){bump("lesson");if(!state.lessons[les.id])addXP(5);state.lessons[les.id]=Math.max(state.lessons[les.id]||0,pct);save()}}
      render();break}
    case "retryQuiz":les.step="quiz";les.qi=0;les.correct=0;les.answered=null;les.order=null;render();break;
    case "pracBack":prac=null;render();window.scrollTo(0,0);break;
    case "pcheck":{const v=($("#pin")||{}).value||"";if(!v.trim()){toast("Сначала введи ответ");break}answerPractice(v);break}
    case "pskip":answerPractice("");break;
    case "pnext":prac.i++;prac.answered=null;prac.input="";
      if(prac.i>=prac.items.length){const k=prac.mode;state.practice[k]=(state.practice[k]||0)+1;state.best[k]=Math.max(state.best[k]||0,prac.correct);bump("practice");save()}
      render();sayCurrent();break;
    case "pracAgain":startPractice(prac.mode,prac.level);break;
    case "claimYes":window._claim&&window._claim(true);break;
    case "claimNo":window._claim&&window._claim(false);break;
    case "openExt":try{TG.openLink(location.href)}catch(e){}break;
    case "gear":openSettings();break;
    case "lvchip":case "openAwards":openAwards();break;
    case "closeM":$("#modal").classList.remove("on");render();break;
    case "auto":state.settings.autoSpeak=!state.settings.autoSpeak;t.classList.toggle("on");save();break;
    case "exportBtn":{const code=encodeState();
      $("#xfer").innerHTML=`<textarea readonly id="xcode" class="mt">${esc(code)}</textarea><div class="muted small">Если код не скопировался сам, выдели его и скопируй вручную.</div>`;
      try{navigator.clipboard.writeText(code).then(()=>toast("Код скопирован"),()=>{})}catch(err){}
      break}
    case "importBtn":$("#xfer").innerHTML=`<textarea id="xin" class="mt" placeholder="Вставь код, начинающийся с PP1:"></textarea><button class="btn block mt" id="importDo">Загрузить прогресс</button><div class="muted small">Текущий прогресс заменится прогрессом из кода.</div>`;break;
    case "importDo":{try{const o=decodeState($("#xin").value);const s0=state.settings;state=merge(o);if(!o.settings)state.settings=s0;if(uid)state.owner=uid;save();sess=null;les=null;prac=null;$("#modal").classList.remove("on");render();toast("Прогресс загружен")}catch(err){toast("Код не подошёл. Проверь, что скопирован целиком.")}break}
    case "reset":confirmReset();break;
    case "doReset":{const s=state.settings;state=DEF();state.settings=s;save();$("#modal").classList.remove("on");sess=null;les=null;prac=null;render();toast("Прогресс сброшен");break}
  }
});
document.addEventListener("click",e=>{const f=e.target.closest("#flip");if(f&&!e.target.closest("button")&&sess&&!sess.flipped){sess.flipped=true;render();if(sess.dir==="ru"&&state.settings.autoSpeak)speak(cardById(sess.cur).it)}});
document.addEventListener("focusin",e=>{if(e.target.id==="xcode")e.target.select()});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="search"){search=t.value;refocus("search",t.value)}
  if(t.id==="phSearch"){phSearch=t.value;refocus("phSearch",t.value)}
  if(t.id==="pin"&&prac)prac.input=t.value;
  if(t.id==="rate"){state.settings.rate=+t.value;$("#rateV").textContent=(+t.value).toFixed(1)+"×"}
  if(t.id==="npd"){state.settings.newPerDay=+t.value;$("#npdV").textContent=t.value}
  if(t.id==="goal"){state.settings.goal=+t.value;$("#goalV").textContent=t.value}
});
document.addEventListener("change",e=>{if(["rate","npd","goal"].includes(e.target.id))save()});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal"&&!window._claimPending){$("#modal").classList.remove("on");render()}});
document.addEventListener("keydown",e=>{
  if(e.target.id==="pin"&&e.key==="Enter"&&prac){e.preventDefault();if(!prac.answered){const v=e.target.value;if(v.trim())answerPractice(v)}else $("#pnext")&&$("#pnext").click();return}
  if(view==="practice"&&prac&&prac.answered&&e.key==="Enter"){const n=$("#pnext");if(n){e.preventDefault();n.click()}return}
  if(view!=="words"||!sess||!sess.cur||e.target.tagName==="INPUT")return;
  if(!sess.flipped&&(e.key===" "||e.key==="Enter")){e.preventDefault();sess.flipped=true;render()}
  else if(sess.flipped&&["1","2","3","4"].includes(e.key))grade(+e.key-1);
});
window.addEventListener("hashchange",()=>{stopDialog();sub=null;les=null;dlg=null;prac=null;fromHash();render()});

fromHash();render();
setTimeout(()=>{pickVoice();if(view==="practice")render()},800);
if(TG)initTG();else initSync();
</script>
</body>
</html>
