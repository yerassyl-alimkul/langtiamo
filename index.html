<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piano Piano — итальянский с нуля</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE; --card:#FFFFFF; --ink:#2A2522; --muted:#7A6F66; --line:#EADFD0;
  --terra:#C4532D; --terra-soft:#F6E2D8; --sea:#1F5F8B; --sea-soft:#DDEAF3;
  --olive:#5F7A2E; --olive-soft:#E6EDD6; --red:#B3261E; --red-soft:#F7DCDA;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not(.light){--bg:#1B1816; --card:#26221F; --ink:#F3ECE4; --muted:#A99D92; --line:#3A3430;
  --terra:#E07A52; --terra-soft:#3D2A22; --sea:#6FA8D6; --sea-soft:#1F3040;
  --olive:#9DB86A; --olive-soft:#2B3320; --red:#F08B84; --red-soft:#3E2422;
  --shadow:none}
}
:root.dark{--bg:#1B1816; --card:#26221F; --ink:#F3ECE4; --muted:#A99D92; --line:#3A3430;
  --terra:#E07A52; --terra-soft:#3D2A22; --sea:#6FA8D6; --sea-soft:#1F3040;
  --olive:#9DB86A; --olive-soft:#2B3320; --red:#F08B84; --red-soft:#3E2422;
  --shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:root{--sat:max(env(safe-area-inset-top),var(--tg-st,0px));--sab:max(env(safe-area-inset-bottom),var(--tg-sb,0px));--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(100px + var(--sab)) calc(16px + var(--sal))}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:22px;letter-spacing:-.01em}
.logo span{color:var(--terra)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--line)}
h1,h2,h3{font-family:Fraunces,serif;font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:28px;line-height:1.15}
h2{font-size:21px;margin:22px 0 10px}
h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;background:var(--terra);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sea{background:var(--sea)}
.btn[disabled]{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--line)}
.pill.ok{background:var(--olive-soft);color:var(--olive)}
.pill.terra{background:var(--terra-soft);color:var(--terra)}
.pill.sea{background:var(--sea-soft);color:var(--sea)}
.hero{display:flex;gap:16px;align-items:center}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-weight:700;font-size:15px;line-height:1.1}
.ring .lbl small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-family:Fraunces,serif}
.stat span{font-size:12px;color:var(--muted)}
.path li{list-style:none;display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.path li:last-child{border-bottom:0}
.path{padding:0;margin:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;font-weight:700}
.chk.done{background:var(--olive);border-color:var(--olive);color:#fff}
.chk.next{border-color:var(--terra);color:var(--terra)}
.link{color:var(--sea);font-weight:600}
.play{width:38px;height:38px;border-radius:50%;background:var(--sea-soft);color:var(--sea);display:grid;place-items:center;flex:none}
.play.slow{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700}
.play.mic{background:var(--terra-soft);color:var(--terra)}
.play.mic.on{background:var(--terra);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.it{font-weight:700;font-size:17px}
.tr{color:var(--terra);font-size:13.5px;font-weight:600}
.ru{color:var(--muted);font-size:14.5px}
.list>.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list>.item:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--shadow)}
.tile b{display:block;font-size:15.5px;margin-bottom:2px}
.tile .em{font-size:22px;display:block;margin-bottom:6px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;margin-bottom:10px;padding:6px 0}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;cursor:pointer;user-select:none}
.flash .big{font-family:Fraunces,serif;font-size:34px;font-weight:700;line-height:1.15}
.flash .hint{font-size:13px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grades button{padding:12px 4px;border-radius:12px;font-weight:700;font-size:14px;line-height:1.2}
.grades small{display:block;font-weight:500;font-size:11px;opacity:.8;margin-top:2px}
.g0{background:var(--red-soft);color:var(--red)}
.g1{background:var(--terra-soft);color:var(--terra)}
.g2{background:var(--olive-soft);color:var(--olive)}
.g3{background:var(--sea-soft);color:var(--sea)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--terra);border-radius:99px;transition:width .3s}
.rule{font-size:15px}
.rule p{margin:8px 0}
.rule table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14.5px}
.rule td{padding:6px 8px;border-bottom:1px solid var(--line)}
.rule td:first-child{color:var(--ink);font-weight:700;width:1%;white-space:nowrap;padding-right:14px}
.rule table.t3 td{width:auto;font-weight:400;white-space:normal}
.rule table.t3 td:first-child{color:var(--muted);font-weight:600}
.rule h3{margin-bottom:6px}
.rule b{color:var(--terra)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);text-align:left;font-weight:600;font-size:16px}
.opt.right{border-color:var(--olive);background:var(--olive-soft);color:var(--olive)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.q{font-family:Fraunces,serif;font-size:22px;font-weight:700;line-height:1.3}
.explain{margin-top:12px;padding:12px;border-radius:12px;background:var(--sea-soft);color:var(--ink);font-size:14.5px}
.hidden-it .it,.hidden-it .tr{filter:blur(6px);transition:filter .2s}
.hidden-it .item.show .it,.hidden-it .item.show .tr{filter:none}
.ex{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);margin:4px 6px 4px 0}
.ex b{font-size:15px}
.ex span{font-size:12.5px;color:var(--terra);font-weight:600}
.ex .play{width:30px;height:30px}
input[type=search],input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
input[type=range]{width:100%;accent-color:var(--terra)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px calc(4px + var(--sar)) calc(8px + var(--sab)) calc(4px + var(--sal));z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;line-height:1.2;font-weight:600;color:var(--muted);border-radius:10px;overflow:visible}
nav.tabs button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs svg{flex:none}
nav.tabs button.on{color:var(--terra)}
nav.tabs svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:min(92vw,480px);text-align:center;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.setrow{padding:14px 0;border-bottom:1px solid var(--line)}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--olive)}
.switch.on::after{left:21px}
.center{text-align:center}
.mt{margin-top:14px}
.done-big{font-size:46px;line-height:1}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:12px 0}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.bub{max-width:88%;padding:10px 12px;border-radius:16px;margin:8px 0;display:flex;gap:8px;align-items:flex-start;cursor:default}
.bub.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{background:var(--terra-soft);margin-left:auto;border-bottom-right-radius:4px}
.bub.now{outline:2px solid var(--sea);outline-offset:1px}
.bub.hid{cursor:pointer}
.who{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.week{display:flex;gap:8px;height:110px;margin-bottom:8px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.wbar{flex:1;width:100%;background:var(--line);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wbar i{display:block;width:100%;background:var(--terra);opacity:.45;border-radius:8px}
.wbar i.full{opacity:1}
.wcol span{font-size:11px;color:var(--muted)}
.wcol.today span{color:var(--terra);font-weight:700}
.bigplay{width:84px;height:84px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;margin:8px auto}
.bigplay svg{width:34px;height:34px}
.answer-in{font-size:20px;text-align:center;font-weight:700}
.answer-in.right{border-color:var(--olive);background:var(--olive-soft)}
.answer-in.wrong{border-color:var(--red);background:var(--red-soft)}
textarea{width:100%;min-height:90px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:13px/1.4 ui-monospace,monospace}
.celeb{position:fixed;left:50%;top:calc(12px + var(--sat));transform:translate(-50%,-160%);transition:transform .35s cubic-bezier(.2,.9,.3,1.25);z-index:40;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;min-width:260px;max-width:92vw;pointer-events:none}
.celeb.on{transform:translate(-50%,0)}
.celeb .e{font-size:32px;line-height:1}
.conf{position:fixed;top:-14px;width:9px;height:14px;z-index:39;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{top:105vh;transform:rotate(760deg)}}
.awards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.aw{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.aw .e{font-size:30px;display:block;line-height:1.2}
.aw.lock .e{filter:grayscale(1);opacity:.3}
.aw b{display:block;font-size:13px;margin-top:4px}
.aw span{font-size:11px;color:var(--muted);display:block;line-height:1.3}
.quest{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.combo{display:block;margin-top:6px;color:var(--terra);font-weight:800}
.tile[disabled]{opacity:.5}
.side-logo{display:none}
.pill.olive{background:var(--olive-soft);color:var(--olive)}
.lvtabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.lvtab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:left;color:var(--ink)}
.lvtab.on{border-color:var(--terra);background:var(--terra-soft)}
.lvbig{font-family:"DM Serif Display",Georgia,serif;font-size:30px;line-height:1}
.lvsub{font-size:13px;color:var(--muted);font-weight:600}
.lvbar{display:block;width:100%;height:5px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}.lvbar i{display:block;height:100%;background:var(--terra)}
.lvtab.on .lvbar{background:rgba(0,0,0,.08)}
.ne{font-style:italic;margin-top:1px}
mark.err{background:transparent;border-bottom:2.5px solid var(--red);color:inherit;padding:0 1px;border-radius:2px}
mark.err.typo{border-bottom-color:#d9a400}mark.err.style{border-bottom:2px dashed var(--muted)}
mark.err sup{font-size:10px;color:var(--red);font-weight:800;margin-left:1px}
.errlist{margin:6px 0 0;padding-left:22px}.errlist li{margin:8px 0}.errlist .frag{text-decoration:line-through;color:var(--red)}
.okline{padding:10px 0;font-weight:700;color:var(--olive)}
.reqs{display:flex;flex-direction:column;gap:6px}.req{font-size:14px}.req.no{color:var(--muted)}
.verdict{padding:10px 12px;border-radius:12px;font-weight:700;font-size:14px}.verdict.ok{background:var(--olive-soft);color:var(--olive)}.verdict.no{background:var(--terra-soft);color:var(--terra)}
.h3s{font-size:16px;margin:4px 0}
.checkgrid{display:grid;gap:14px}
@media (min-width:900px){.checkgrid{grid-template-columns:1.3fr 1fr}.lvtab{padding:16px 20px}.lvbig{font-size:34px}}

.dash>div>*:first-child{margin-top:0}
@media (min-width:900px){
  body{padding-left:236px}
  nav.tabs{top:0;bottom:0;left:0;right:auto;width:236px;flex-direction:column;justify-content:flex-start;align-items:stretch;border-top:0;border-right:1px solid var(--line);padding:26px 14px}
  .side-logo{display:block;font-family:Fraunces,serif;font-weight:700;font-size:25px;padding:2px 14px 24px;letter-spacing:-.01em}
  .side-logo span{color:var(--terra)}
  nav.tabs .in{flex-direction:column;gap:4px;max-width:none}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;font-size:15px;border-radius:12px}
  nav.tabs button span{overflow:visible}
  nav.tabs button.on{background:var(--terra-soft)}
  nav.tabs button:not(.on):hover{background:var(--line);color:var(--ink)}
  header.top .logo{visibility:hidden}
  .wrap{max-width:1120px;padding:24px 44px 56px}
  #app.narrow{max-width:760px;margin:0 auto}
  h1{font-size:32px}
  .dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
  .dash h2{margin-top:26px}
  .modgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .modgrid>.card{margin-top:0!important}
  .grid2{grid-template-columns:repeat(3,minmax(0,1fr))}
  .split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
  .split .sticky{position:sticky;top:24px}
  .h2top{margin-top:4px}
  .readtext{font-size:19px;line-height:1.85;padding:22px}
  .toast{bottom:32px;left:calc(50% + 118px)}
  body .gloss{bottom:28px;left:calc(50% + 118px);width:min(520px,60vw)}
  body .gloss:not(.on){transform:translate(-50%,200%)}
  .celeb{left:calc(50% + 118px)}
  .modal{align-items:center}
  .sheet{border-radius:20px;max-height:86vh;padding:24px}
  .btn:hover:not([disabled]){filter:brightness(1.06)}
  .opt:hover:not([disabled]),.tile:hover,.card[data-mod]:hover{border-color:var(--terra)}
  .flash{min-height:320px}
  .flash .big{font-size:42px}
}
@media (min-width:1320px){.grid2{grid-template-columns:repeat(4,minmax(0,1fr))}}
.readtext{font-size:18px;line-height:1.75}
.w{cursor:pointer;border-radius:4px;padding:0 1px}
.w:hover,.w:active{background:var(--sea-soft)}
.gloss{position:fixed;left:50%;bottom:calc(74px + var(--sab));transform:translate(-50%,140%);width:min(540px,94vw);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:25;transition:transform .25s,visibility .25s;visibility:hidden;pointer-events:none}
.gloss.on{transform:translate(-50%,0);visibility:visible;pointer-events:auto}
.orderline{min-height:48px;padding:8px;border:1.5px dashed var(--line);border-radius:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">

{id:"gn",t:"GN",d:"Читается как «нь», как в слове «коньяк».",ex:[["bagno","бАньо"],["gnocchi","ньОкки"],["signora","синьОра"],["lasagna","лазАнья"]]},
{id:"sc",t:"SC и SCH",d:"SC перед e/i читается «ш». SCH — «ск».",ex:[["pesce","пЕше"],["uscita","ушИта"],["scusi","скУзи"],["schiena","скьЕна"]]},
{id:"h",t:"H не читается",d:"Буква H никогда не произносится. Она нужна только для написания: ho, hai, ha, hanno от глагола avere.",ex:[["ho","о"],["hai","ай"],["hanno","Анно"],["hotel","отЭль"]]},
{id:"z",t:"Z: «ц» или «дз»",d:"Z читается «ц» или «дз», в зависимости от слова. Запоминай на слух.",ex:[["pizza","пИцца"],["grazie","грАцие"],["zucchero","дзУккеро"],["zero","дзЭро"]]},
{id:"dbl",t:"Двойные согласные",d:"Двойную согласную держи заметно дольше. От этого меняется смысл: nono — девятый, nonno — дедушка.",ex:[["nono","нОно"],["nonno","нОнно"],["sete","сЕте"],["sette","сЭтте"],["caro","кАро"],["carro","кАрро"]]},
{id:"vow",t:"Гласные без редукции",d:"В отличие от русского, гласные не «съедаются»: o всегда «о», e всегда «е», даже без ударения.",ex:[["molto","мОльто"],["pomodoro","помодОро"],["bene","бЕне"],["Messina","мессИна"]]},
{id:"r",t:"Раскатистая R",d:"R звучит чётко, с вибрацией кончика языка. Двойная RR — ещё дольше.",ex:[["Roma","рОма"],["treno","трЕно"],["birra","бИрра"],["arrivederci","арриведЕрчи"]]},
{id:"qu",t:"QU",d:"Читается «ку» + следующий гласный, слитно.",ex:[["quattro","куАттро"],["questo","куЭсто"],["acqua","Аккуа"]]}
];

const LESSONS=[
{id:"g1",t:"Артикли и род",ex:[["il libro","книга"],["il treno","поезд"],["lo studente","студент"],["lo zucchero","сахар"],["l'amico","друг"],["la casa","дом"],["la stazione","вокзал"],["l'acqua","вода"],["un caffè","(один) кофе"],["uno zaino","рюкзак"],["una pizza","пицца"],["un'amica","подруга"]],
rule:`<p>Мужской род обычно на <b>-o</b>, женский на <b>-a</b>. На <b>-e</b> бывает и тот и другой: il pane (м.), la stazione (ж.). Поэтому учи слова сразу с артиклем.</p>
<table><tr><td>il</td><td>м. р. перед согласной: il treno</td></tr><tr><td>lo</td><td>м. р. перед s+согласная, z, gn, ps: lo studente, lo zaino</td></tr><tr><td>la</td><td>ж. р. перед согласной: la casa</td></tr><tr><td>l'</td><td>перед гласной, любой род: l'amico, l'acqua</td></tr></table>
<p>Неопределённый артикль («какой-то, один»): <b>un</b> (м.), <b>uno</b> (там же, где lo), <b>una</b> (ж.), <b>un'</b> (ж. перед гласной).</p>`,
q:[["___ treno",["il","lo","la"],0,"treno — м. р., начинается с обычной согласной → il."],
["___ zaino (рюкзак)",["il","lo","l'"],1,"Перед z мужской артикль lo."],
["___ mela",["la","il","l'"],0,"mela на -a, женский род, согласная → la."],
["___ ospedale",["il","lo","l'"],2,"Перед гласной → l'."],
["___ pane",["la","il","lo"],1,"pane — мужской род, хоть и на -e."],
["Неопределённый: ___ amica",["una","un'","un"],1,"Женский род перед гласной → un'."],
["Неопределённый: ___ studente",["un","uno","una"],1,"s + согласная → uno."],
["___ stazione",["il","la","l'"],1,"stazione — женский род (все слова на -zione женские)."]]},
{id:"g2",t:"essere и avere",ex:[["Sono stanco.","Я устал."],["Sei italiano?","Ты итальянец?"],["Lei è di Messina.","Она из Мессины."],["Siamo studenti.","Мы студенты."],["Ho 23 anni.","Мне 23 года (букв. «имею 23 года»)."],["Hai fame?","Ты голоден?"],["Abbiamo lezione alle nove.","У нас лекция в девять."]],
rule:`<p>Два главных глагола. Местоимение обычно не говорят: «Sono stanco», а не «Io sono stanco».</p>
<table><tr><td>essere — быть</td><td>sono, sei, è, siamo, siete, sono</td></tr><tr><td>avere — иметь</td><td>ho, hai, ha, abbiamo, avete, hanno</td></tr></table>
<p>H не читается: ho = «о», hanno = «Анно». <b>è</b> (есть) с чёрточкой, а <b>e</b> без неё — это «и».</p>
<p>Возраст, голод, жажду и холод итальянцы «имеют»: ho 23 anni, ho fame, ho sete, ho freddo.</p>`,
q:[["Io ___ studente.",["sono","ho","è"],0,"Я есть студент → sono."],
["Noi ___ fame.",["siamo","abbiamo","avete"],1,"Голод «имеют»: abbiamo fame."],
["Lei ___ di Roma.",["ha","è","sei"],1,"Она есть из Рима → è."],
["Tu ___ 23 anni?",["sei","hai","ha"],1,"Возраст через avere: hai."],
["Loro ___ a casa.",["sono","hanno","siete"],0,"Они (есть) дома → sono."],
["Voi ___ freddo?",["siete","avete","hanno"],1,"Холод «имеют»: avete freddo."],
["Marco ___ una sorella.",["è","ha","hai"],1,"У Марко есть сестра → ha."]]},
{id:"g3",t:"Глаголы на&nbsp;&#8209;are",ex:[["Parlo russo e inglese.","Я говорю по-русски и по-английски."],["Parli italiano?","Ты говоришь по-итальянски?"],["Lei abita a Messina.","Она живёт в Мессине."],["Studiamo data science.","Мы изучаем data science."],["Dove lavorate?","Где вы работаете?"],["Mangiano la pizza.","Они едят пиццу."]],
rule:`<p>Убираешь <b>-are</b> и добавляешь окончание. parlare → parl-:</p>
<table><tr><td>io</td><td>parl<b>o</b></td></tr><tr><td>tu</td><td>parl<b>i</b></td></tr><tr><td>lui / lei</td><td>parl<b>a</b></td></tr><tr><td>noi</td><td>parl<b>iamo</b></td></tr><tr><td>voi</td><td>parl<b>ate</b></td></tr><tr><td>loro</td><td>parl<b>ano</b></td></tr></table>
<p>Ударение в loro: <b>PAR</b>lano, а не parLAno. Звук сохраняют: pagare → paghi, cercare → cerchi. studiare → studi, studiamo (одна i).</p>`,
q:[["Io ___ inglese. (parlare)",["parlo","parla","parli"],0,"io → -o."],
["Tu ___ a Messina? (abitare)",["abiti","abita","abito"],0,"tu → -i."],
["Noi ___ all'università. (studiare)",["studiate","studiamo","studiano"],1,"noi → -iamo, с одной i: studiamo."],
["Loro ___ il treno. (aspettare)",["aspettano","aspettate","aspetta"],0,"loro → -ano."],
["Voi ___ la pizza? (mangiare)",["mangiamo","mangiate","mangi"],1,"voi → -ate."],
["Lui ___ con la carta. (pagare)",["paghi","paga","pago"],1,"lui → -a: paga."],
["Tu ___ le chiavi? (cercare)",["cerci","cerchi","cerca"],1,"Чтобы осталось «к», добавляем h: cerchi."]]},
{id:"g4",t:"Множественное число",ex:[["il libro → i libri","книги"],["la casa → le case","дома"],["lo studente → gli studenti","студенты"],["l'amico → gli amici","друзья"],["la stazione → le stazioni","вокзалы"],["il caffè → i caffè","кофе (мн.)"]],
rule:`<p>Окончания: <b>-o → -i</b>, <b>-a → -e</b>, <b>-e → -i</b>. Слова с ударением на конце и иностранные не меняются: caffè, città, bar, autobus.</p>
<table><tr><td>il →</td><td>i (i libri)</td></tr><tr><td>lo, l' (м.) →</td><td>gli (gli studenti, gli amici)</td></tr><tr><td>la, l' (ж.) →</td><td>le (le case, le amiche)</td></tr></table>`,
q:[["il treno → ___",["i treni","le trene","gli treni"],0,"-o → -i, il → i."],
["la mela → ___",["le mele","i meli","le mela"],0,"-a → -e, la → le."],
["lo zaino → ___",["i zaini","gli zaini","le zaine"],1,"lo → gli."],
["la lezione → ___",["le lezione","le lezioni","i lezioni"],1,"-e → -i, а артикль женский le."],
["il bar → ___",["i bari","i bar","le bar"],1,"Иностранное слово не меняется."],
["l'amica → ___",["gli amici","le amiche","le amice"],1,"Женский род: le amiche (h сохраняет звук «к»)."]]},
{id:"g5",t:"Глаголы на&nbsp;‑ere и&nbsp;‑ire",ex:[["Prendo un caffè.","Я беру кофе."],["Vedi il mare?","Ты видишь море?"],["Dormo poco.","Я мало сплю."],["Parti domani?","Ты уезжаешь завтра?"],["Capisco.","Я понимаю."],["Finiamo alle sei.","Мы заканчиваем в шесть."]],
rule:`<table><tr><td>prendere</td><td>prendo, prendi, prende, prendiamo, prendete, prendono</td></tr><tr><td>dormire</td><td>dormo, dormi, dorme, dormiamo, dormite, dormono</td></tr><tr><td>capire (-isc-)</td><td>capisco, capisci, capisce, capiamo, capite, capiscono</td></tr></table>
<p>Часть глаголов на -ire добавляют <b>-isc-</b>: capire, finire, preferire, pulire. Читается: capisco «капИско», capisci «капИши».</p>`,
q:[["Io ___ l'autobus. (prendere)",["prendo","prende","prendi"],0,"io → -o."],
["Lei ___ fino alle nove. (dormire)",["dormi","dorme","dorma"],1,"lei → -e."],
["Non ___ . (io, capire)",["capo","capisco","capisce"],1,"capire с -isc-: capisco."],
["Voi ___ il treno? (prendere)",["prendete","prendite","prendono"],0,"-ere: voi → -ete."],
["Loro ___ il caffè. (preferire)",["preferono","preferiscono","preferiamo"],1,"-isc- в loro: preferiscono."],
["Noi ___ alle sei. (finire)",["finiamo","finiscono","finite"],0,"В noi -isc- нет: finiamo."]]},
{id:"g6",t:"Отрицание и вопросы",ex:[["Non parlo italiano.","Я не говорю по-итальянски."],["Parli inglese?","Ты говоришь по-английски?"],["Dove abiti?","Где ты живёшь?"],["Quanto costa?","Сколько стоит?"],["Perché? — Perché sono stanco.","Почему? — Потому что я устал."],["Non bevo mai caffè.","Я никогда не пью кофе."]],
rule:`<p>Отрицание: <b>non</b> перед глаголом. Двойное отрицание нормально: Non bevo mai caffè.</p>
<p>Вопрос строится как утверждение, меняется только интонация: голос вверх в конце.</p>
<table><tr><td>chi</td><td>кто</td></tr><tr><td>(che) cosa</td><td>что</td></tr><tr><td>dove</td><td>где, куда</td></tr><tr><td>quando</td><td>когда</td></tr><tr><td>quanto</td><td>сколько</td></tr><tr><td>come</td><td>как</td></tr><tr><td>perché</td><td>почему; потому что</td></tr><tr><td>quale</td><td>какой, который</td></tr></table>`,
q:[["___ costa il biglietto?",["Quanto","Dove","Chi"],0,"Сколько стоит → Quanto."],
["___ è la stazione?",["Quando","Dove","Come"],1,"Где → Dove."],
["___ ti chiami?",["Come","Cosa","Perché"],0,"Как тебя зовут → Come ti chiami."],
["Io ___ parlo tedesco.",["no","non","mai"],1,"Перед глаголом ставим non."],
["___ parte il treno? — Alle dieci.",["Dove","Quando","Chi"],1,"Ответ про время → Quando."],
["Non mangio ___ carne. (никогда)",["mai","niente","no"],0,"никогда → mai."],
["___ è? — È il professore.",["Chi","Che","Quale"],0,"Про человека → Chi."]]},
{id:"g7",t:"C'è и ci sono",ex:[["C'è un supermercato qui vicino?","Здесь рядом есть супермаркет?"],["Ci sono due fermate.","Есть две остановки."],["Non c'è latte.","Молока нет."],["C'è posto?","Есть место?"],["Ci sono problemi?","Есть проблемы?"]],
rule:`<p><b>c'è</b> + единственное число = «есть, имеется». <b>ci sono</b> + множественное.</p>
<p>Отрицание: non c'è, non ci sono. Не путай с è: «È grande» — «он большой», а «C'è» — «имеется».</p>`,
q:[["___ una farmacia qui?",["C'è","Ci sono","È"],0,"Одна аптека → c'è."],
["___ molti studenti.",["C'è","Ci sono","Sono"],1,"Много студентов → ci sono."],
["Non ___ pane.",["ci sono","c'è","è"],1,"Хлеб — единственное число."],
["___ due bagni in casa.",["Ci sono","C'è","Ha"],0,"Две ванные → ci sono."],
["Scusi, ___ un bancomat vicino?",["ci sono","c'è","è"],1,"Один банкомат → c'è."]]},
{id:"g8",t:"andare, fare, volere, potere",ex:[["Vado all'università.","Я иду в университет."],["Andiamo al mare?","Пойдём на море?"],["Faccio la spesa.","Я делаю покупки."],["Che cosa fai?","Что ты делаешь?"],["Vorrei un caffè.","Я бы хотел кофе (вежливо)."],["Posso pagare con la carta?","Можно картой?"],["Devo andare.","Мне надо идти."]],
rule:`<p>Самые нужные неправильные глаголы, их просто запоминаешь:</p>
<table><tr><td>andare</td><td>vado, vai, va, andiamo, andate, vanno</td></tr><tr><td>fare</td><td>faccio, fai, fa, facciamo, fate, fanno</td></tr><tr><td>volere</td><td>voglio, vuoi, vuole, vogliamo, volete, vogliono</td></tr><tr><td>potere</td><td>posso, puoi, può, possiamo, potete, possono</td></tr><tr><td>dovere</td><td>devo, devi, deve, dobbiamo, dovete, devono</td></tr></table>
<p>После volere, potere, dovere идёт инфинитив: Posso entrare? Devo andare. В кафе и магазине вместо voglio говори вежливое <b>vorrei</b> — «я бы хотел».</p>`,
q:[["Io ___ a casa. (andare)",["ando","vado","va"],1,"andare неправильный: vado."],
["Che cosa ___ stasera? (tu, fare)",["fai","fa","faci"],0,"tu → fai."],
["___ pagare con la carta? (io, potere)",["Poto","Posso","Può"],1,"io → posso."],
["Noi ___ al mare. (andare)",["andiamo","vanno","andate"],0,"noi → andiamo."],
["Loro ___ un gelato. (volere)",["vogliono","volono","vuole"],0,"loro → vogliono."],
["Lei ___ lavorare domani. (dovere)",["deve","dove","devi"],0,"lei → deve. dove — это «где»."],
["___ un cappuccino, per favore. (вежливо)",["Voglio","Vorrei","Vuole"],1,"Вежливо → vorrei."]]},
{id:"g9",t:"Mi piace",ex:[["Mi piace il caffè.","Мне нравится кофе."],["Mi piace Messina.","Мне нравится Мессина."],["Mi piacciono gli arancini.","Мне нравятся аранчини."],["Ti piace la pizza?","Тебе нравится пицца?"],["Non mi piace il freddo.","Я не люблю холод."],["Mi piace studiare.","Мне нравится учиться."]],
rule:`<p>Строится как в русском «мне нравится». Одна вещь или действие → <b>piace</b>, несколько вещей → <b>piacciono</b>.</p>
<table><tr><td>mi</td><td>мне</td></tr><tr><td>ti</td><td>тебе</td></tr><tr><td>gli / le</td><td>ему / ей (le — и вежливое «Вам»)</td></tr><tr><td>ci</td><td>нам</td></tr><tr><td>vi</td><td>вам</td></tr><tr><td>gli</td><td>им</td></tr></table>
<p>Артикль нужен: Mi piace <b>il</b> mare.</p>`,
q:[["Mi ___ la granita.",["piace","piacciono","piaccio"],0,"Одна вещь → piace."],
["Mi ___ i cannoli.",["piace","piacciono","piaci"],1,"Несколько → piacciono."],
["___ piace il mare? (тебе)",["Ti","Tu","Mi"],0,"тебе → ti."],
["Non mi piace ___ freddo.",["il","lo","la"],0,"freddo — м. р., согласная → il."],
["Ci ___ viaggiare.",["piacciono","piace","piacere"],1,"Действие (инфинитив) → piace."]]},
{id:"g10",t:"Предлоги a, in, di, da",ex:[["Abito a Messina.","Я живу в Мессине."],["Studio in Italia.","Я учусь в Италии."],["Vado in farmacia.","Я иду в аптеку."],["Sono di Almaty.","Я из Алматы."],["Vengo da Roma.","Я еду из Рима."],["Vado dal medico.","Я иду к врачу."],["Il treno per Palermo.","Поезд на Палермо."],["Esco con gli amici.","Я гуляю с друзьями."]],
rule:`<table><tr><td>a</td><td>города и «куда»: a Messina, a casa, a lezione</td></tr><tr><td>in</td><td>страны, регионы, многие места: in Italia, in Sicilia, in centro, in banca, in farmacia</td></tr><tr><td>di</td><td>чей и откуда родом: il libro di Marco, sono di Almaty</td></tr><tr><td>da</td><td>откуда: vengo da Roma; к человеку: vado dal medico</td></tr><tr><td>con</td><td>с: con gli amici</td></tr><tr><td>per</td><td>для; направление поезда: per Palermo</td></tr></table>
<p>«Sono <b>di</b> Almaty» — я родом из Алматы. «Vengo <b>da</b> Almaty» — я еду (прилетел) из Алматы.</p>`,
q:[["Abito ___ Messina.",["a","in","di"],0,"Город → a."],
["Studio ___ Italia.",["a","in","da"],1,"Страна → in."],
["Sono ___ Almaty.",["di","da","a"],0,"Откуда родом → essere di."],
["Vado ___ farmacia.",["a","in","di"],1,"Аптека, банк, центр → in."],
["Il treno ___ Catania.",["per","con","di"],0,"Направление поезда → per."],
["Vengo ___ Roma.",["di","da","in"],1,"Откуда еду → da."],
["Esco ___ i miei amici.",["con","per","da"],0,"с друзьями → con."]]},
{id:"g11",t:"Предлоги с артиклями",ex:[["Vado al mare.","Я иду на море. (a + il)"],["Vado all'università.","Я иду в университет. (a + l')"],["Il libro è sul tavolo.","Книга на столе. (su + il)"],["Le chiavi sono nella borsa.","Ключи в сумке. (in + la)"],["Torno dalla stazione.","Я возвращаюсь с вокзала. (da + la)"],["Il nome del professore.","Имя преподавателя. (di + il)"]],
rule:`<p>Предлоги a, di, da, in, su сливаются с артиклем в одно слово:</p>
<table><tr><td>a +</td><td>al, allo, alla, all', ai, agli, alle</td></tr><tr><td>di +</td><td>del, dello, della, dell', dei, degli, delle</td></tr><tr><td>da +</td><td>dal, dallo, dalla, dall', dai, dagli, dalle</td></tr><tr><td>in +</td><td>nel, nello, nella, nell', nei, negli, nelle</td></tr><tr><td>su +</td><td>sul, sullo, sulla, sull', sui, sugli, sulle</td></tr></table>
<p>Порядок в строке всегда тот же: il, lo, la, l', i, gli, le. С con и per не сливаются.</p>`,
q:[["Vado ___ mare. (a + il)",["al","alla","allo"],0,"a + il = al."],
["Le chiavi sono ___ borsa. (in + la)",["nel","nella","nello"],1,"in + la = nella."],
["Il libro è ___ tavolo. (su + il)",["sul","sulla","sullo"],0,"su + il = sul."],
["Torno ___ stazione. (da + la)",["dal","dalla","dalle"],1,"da + la = dalla."],
["Il nome ___ professore. (di + il)",["del","dello","della"],0,"di + il = del."],
["Vado ___ università. (a + l')",["all'","al","alla"],0,"a + l' = all'."],

{id:"g12",t:"Мой, твой, наш",ex:[["il mio telefono","мой телефон"],["la mia casa","мой дом"],["i miei amici","мои друзья"],["le mie chiavi","мои ключи"],["mia moglie","моя жена (без артикля)"],["tuo fratello","твой брат"],["il nostro professore","наш преподаватель"],["Com'è la tua città?","Какой у тебя город?"]],

post:`<table><tr><td>-o →</td><td>-i (libri)</td></tr><tr><td>-a →</td><td>-e (case)</td></tr><tr><td>-e →</td><td>-i (studenti, notti), и для мужского, и для женского</td></tr></table>`,

{h:"Артикли во множественном",
pre:`<p>Артикль тоже меняется:</p>`,
ex:[["il libro → i libri","книги"],["lo studente → gli studenti","студенты"],["l'amico → gli amici","друзья"],["la casa → le case","дома"],["l'amica → le amiche","подруги"]],
post:`<table><tr><td>il →</td><td>i</td></tr><tr><td>lo, l' (м.) →</td><td>gli (читается «льи»)</td></tr><tr><td>la, l' (ж.) →</td><td>le</td></tr></table>`,
c:["lo zaino → ___ zaini",["i","gli","le"],1,"lo → gli."]},
{h:"Слова, которые не меняются",
pre:`<p>Здесь меняется только артикль:</p>`,
ex:[["il caffè → i caffè","кофе"],["la città → le città","города"],["il bar → i bar","бары"],["l'autobus → gli autobus","автобусы"],["la foto → le foto","фото"]],
post:`<p>Не меняются: слова с ударением на последнем слоге (caffè, città, università), иностранные (bar, sport, film, autobus) и сокращённые (la foto, la bici).</p>`,
c:["l'università → le ___",["università","universite","universitè"],0,"Ударение на конце — слово не меняется."]},
{h:"Чтобы звук не менялся",
pre:`<p>Иногда добавляется h:</p>`,
ex:[["l'amica → le amiche","подруги"],["la banca → le banche","банки"],["l'amico → gli amici","друзья"],["il tedesco → i tedeschi","немцы"]],
post:`<p><b>-ca, -ga → -che, -ghe</b>: h сохраняет звук «к» и «г».</p><p>У мужских на -co бывает по-разному: amico → amici («амИчи»), но tedesco → tedeschi. Такие слова запоминаются со временем.</p>`,
c:["la banca → le ___",["banche","banci","bance"],0,"-ca → -che."]}

g5:[
{h:"Глаголы на -ere",
pre:`<p>Глагол <b>prendere</b> (брать) и другие на -ere:</p>`,
ex:[["Prendo un caffè.","Я беру кофе."],["Vedi il mare?","Ты видишь море?"],["Scrive una mail.","Он пишет письмо."],["Leggiamo un libro.","Мы читаем книгу."],["Prendete il treno?","Вы едете на поезде?"],["Vivono a Messina.","Они живут в Мессине."]],
post:`<table><tr><td>io</td><td>-o (prendo)</td></tr><tr><td>tu</td><td>-i (prendi)</td></tr><tr><td>lui / lei</td><td>-e (prende)</td></tr><tr><td>noi</td><td>-iamo (prendiamo)</td></tr><tr><td>voi</td><td>-ete (prendete)</td></tr><tr><td>loro</td><td>-ono (prendono)</td></tr></table>
<p>От -are отличаются только три формы: lui (<b>-e</b> вместо -a), voi (<b>-ete</b>) и loro (<b>-ono</b>).</p>`,
c:["Lei ___ una mail. (scrivere)",["scriva","scrive","scrivi"],1,"lui/lei → -e."]},
{h:"Глаголы на -ire",
pre:`<p>Глагол <b>dormire</b> (спать) и похожие:</p>`,
ex:[["Dormo poco.","Я мало сплю."],["Parti domani?","Ты уезжаешь завтра?"],["Sente la musica.","Он слышит музыку."],["Apriamo la finestra.","Мы открываем окно."],["Aprite la porta?","Вы откроете дверь?"],["Partono alle otto.","Они уезжают в восемь."]],
post:`<p>Почти как -ere, отличие одно: voi → <b>-ite</b> (dormite, partite).</p>
<table><tr><td>io / tu / lui</td><td>dormo, dormi, dorme</td></tr><tr><td>noi / voi / loro</td><td>dormiamo, dormite, dormono</td></tr></table>`,
c:["Voi ___ domani? (partire)",["partete","partite","partono"],1,"-ire: voi → -ite."]},
{h:"Вставка -isc-",
pre:`<p>Многие глаголы на -ire добавляют кусочек <b>-isc-</b>:</p>`,
ex:[["capisco","я понимаю"],["capisci","ты понимаешь"],["capisce","он понимает"],["capiamo","мы понимаем"],["capite","вы понимаете"],["capiscono","они понимают"]],
post:`<p>-isc- появляется в io, tu, lui и loro, а в noi и voi его нет. Так спрягаются capire, finire (заканчивать), preferire (предпочитать), pulire (убирать).</p><p>Чтение: sc + o = «ско», sc + i/e = «ши/ше»: capisco = «капИско», capisci = «капИши».</p>`,
c:["Non ___ . (io, capire)",["capo","capisco","capiscio"],1,"Вставка -isc-: capisco."]}
],
g6:[

post:`<table><tr><td>mai</td><td>никогда</td></tr><tr><td>niente</td><td>ничего</td></tr><tr><td>nessuno</td><td>никто</td></tr></table><p>Схема: <b>non</b> + глагол + mai / niente / nessuno.</p>`,

{h:"Вопросительные слова",

ex:[["Chi è?","Кто это?"],["Cosa fai?","Что ты делаешь?"],["Dove abiti?","Где ты живёшь?"],["Quando parte?","Когда отправляется?"],["Quanto costa?","Сколько стоит?"],["Come stai?","Как дела?"],["Perché?","Почему?"]],

],
g7:[
{h:"c'è и ci sono",
pre:`<p>Так говорят, что что-то <b>есть, имеется</b>:</p>`,
ex:[["C'è un bar qui?","Здесь есть бар?"],["C'è il sole.","Солнечно (букв. «есть солнце»)."],["Ci sono due bagni.","Есть две ванные."],["Ci sono molti studenti.","Много студентов."]],

ex:[["C'è un problema.","Есть проблема."],["È un problema.","Это проблема."],["C'è Marco?","Марко здесь?"],["È Marco.","Это Марко."]],

c:["«Здесь нет Wi-Fi» — Non ___ il Wi-Fi.",["è","c'è","ci sono"],1,"Нет, не имеется → non c'è."]}
],
g8:[
{h:"andare — идти, ехать",
pre:`<p>Этот глагол неправильный, его просто запоминаешь:</p>`,
ex:[["Vado all'università.","Я иду в университет."],["Vai a casa?","Ты идёшь домой?"],["Va al mare.","Он едет на море."],["Andiamo!","Пошли!"],["Andate in centro?","Вы идёте в центр?"],["Vanno a Roma.","Они едут в Рим."]],
post:`<table><tr><td>andare</td><td>vado, vai, va, andiamo, andate, vanno</td></tr></table><p>Одно слово для «идти» и «ехать»: Vado a Roma — и пешком, и на поезде.</p>`,
c:["Io ___ a casa.",["ando","vado","va"],1,"io → vado."]},
{h:"fare — делать",
pre:`<p>Один из самых частых глаголов:</p>`,
ex:[["Che cosa fai?","Что ты делаешь?"],["Faccio la spesa.","Я хожу за продуктами."],["Fa caldo.","Жарко."],["Facciamo una pausa.","Давайте сделаем перерыв."],["Faccio colazione.","Я завтракаю."]],
post:`<table><tr><td>fare</td><td>faccio, fai, fa, facciamo, fate, fanno</td></tr></table><p>fare значит не только «делать». Через него говорят о погоде (fa caldo, fa freddo) и в устойчивых выражениях: fare la spesa (покупать продукты), fare colazione (завтракать), fare una domanda (задать вопрос).</p>`,

{h:"Хочу, могу, должен",

ex:[["Voglio dormire.","Я хочу спать."],["Vorrei un caffè.","Я бы хотел кофе."],["Posso entrare?","Можно войти?"],["Puoi ripetere?","Можешь повторить?"],["Devo studiare.","Мне надо учиться."]],

<p><b>Vorrei</b> — «я бы хотел», вежливая форма. «Voglio un caffè» в баре звучит грубовато, «Vorrei un caffè» — вежливо.</p>`,

g9:[
{h:"Как устроено «нравится»",
pre:`<p>Посмотри внимательно:</p>`,
ex:[["Mi piace il caffè.","Мне нравится кофе."],["Mi piace Messina.","Мне нравится Мессина."],["Mi piace studiare.","Мне нравится учиться."],["Ti piace?","Тебе нравится?"]],
post:`<p>Как в русском «мне нравится»: тот, кто любит, стоит в форме «мне» (mi), а то, что нравится, — главное слово. Поэтому глагол зависит от предмета, а не от человека.</p>`,
c:["«Мне нравится море» — Mi ___ il mare.",["piace","piaccio","piaci"],0,"Одна вещь → piace."]},
{h:"piace или piacciono",
pre:`<p>Сравни:</p>`,
ex:[["Mi piace la pizza.","Мне нравится пицца."],["Mi piacciono gli arancini.","Мне нравятся аранчини."],["Mi piacciono i cannoli.","Мне нравятся канноли."],["Mi piace cucinare.","Мне нравится готовить."]],
post:`<p>Одна вещь или действие (начальная форма глагола) → <b>piace</b>. Несколько вещей → <b>piacciono</b>. Артикль перед вещью нужен: mi piace <b>il</b> mare.</p>`,

ex:[["Ti piace il mare?","Тебе нравится море?"],["Gli piace il calcio.","Ему нравится футбол."],["Le piace la musica?","Ей (или Вам) нравится музыка?"],["Ci piace Messina.","Нам нравится Мессина."],["Non mi piace il freddo.","Мне не нравится холод."]],
post:`<table><tr><td>mi</td><td>мне</td></tr><tr><td>ti</td><td>тебе</td></tr><tr><td>gli / le</td><td>ему / ей (le — и вежливое «Вам»)</td></tr><tr><td>ci</td><td>нам</td></tr><tr><td>vi</td><td>вам</td></tr><tr><td>gli</td><td>им</td></tr></table>`,
c:["«Нам нравится» — ___ piace.",["Ci","Noi","Vi"],0,"нам → ci."]}
],

<p>«Где» и «куда» не различаются: sono a Roma (я в Риме) и vado a Roma (еду в Рим).</p>`,

g11:[
{h:"Предлог + артикль = одно слово",
pre:`<p>Смотри, что происходит:</p>`,
ex:[["Vado al mare.","Я иду на море. (a + il)"],["Vado all'università.","Я иду в университет. (a + l')"],["Vado alla stazione.","Я иду на вокзал. (a + la)"],["Parlo agli studenti.","Я говорю студентам. (a + gli)"]],
post:`<p>Предлоги <b>a, di, da, in, su</b> сливаются с артиклем. Это обязательно: «a il mare» сказать нельзя, только <b>al mare</b>.</p>
<table><tr><td>a + il, lo, la, l'</td><td>al, allo, alla, all'</td></tr><tr><td>a + i, gli, le</td><td>ai, agli, alle</td></tr></table>`,
c:["Vado ___ mare. (a + il)",["al","alla","allo"],0,"a + il = al."]},
{h:"Вся таблица",
pre:`<p>Запомни одну строку a, остальные строятся так же:</p>`,
ex:[["Il nome del professore.","Имя преподавателя. (di + il)"],["Torno dalla stazione.","Возвращаюсь с вокзала. (da + la)"],["Le chiavi sono nella borsa.","Ключи в сумке. (in + la)"],["Il libro è sul tavolo.","Книга на столе. (su + il)"]],
post:`<table><tr><td>a</td><td>al, allo, alla, all', ai, agli, alle</td></tr><tr><td>di → de-</td><td>del, dello, della, dell', dei, degli, delle</td></tr><tr><td>da</td><td>dal, dallo, dalla, dall', dai, dagli, dalle</td></tr><tr><td>in → ne-</td><td>nel, nello, nella, nell', nei, negli, nelle</td></tr><tr><td>su</td><td>sul, sullo, sulla, sull', sui, sugli, sulle</td></tr></table>`,
c:["Le chiavi sono ___ borsa. (in + la)",["nel","nella","nello"],1,"in + la = nella."]},
{h:"Когда сливать не нужно",
pre:`<p>Сравни:</p>`,
ex:[["Vado in banca.","Я иду в банк."],["Vado nella banca di Marco.","Я иду в банк Марко."],["Sono a casa.","Я дома."],["Vado al mare.","Я иду на море."]],
post:`<p>Слияние нужно, только когда перед словом стоит артикль. Если место говорится без артикля (in banca, a casa, a Messina, in Italia), то и сливать нечего. Как только появляется артикль (la banca di Marco), появляется и слияние: nella banca.</p>`,
c:["Vado ___ biblioteca. (просто «в библиотеку»)",["in","nella","alla"],0,"Место из списка «in» без артикля → in biblioteca."]}
],

<p><b>suo</b> значит и «его», и «её»: il suo libro — его или её книга, понятно из контекста. Форма зависит от предмета: libro мужского рода → suo.</p>`,

{h:"Родственники без артикля",

g13:[
{h:"Глаголы на «-ся»",
pre:`<p>Посмотри на глагол chiamarsi (зваться):</p>`,
ex:[["Mi chiamo Yera.","Меня зовут Ера."],["Come ti chiami?","Как тебя зовут?"],["Si chiama Giulia.","Её зовут Джулия."],["Ci chiamiamo…","Нас зовут…"]],
post:`<p>Окончание <b>-si</b> у начальной формы — это русское «-ся». При спряжении si превращается в маленькое слово перед глаголом:</p>
<table><tr><td>io</td><td>mi chiamo</td></tr><tr><td>tu</td><td>ti chiami</td></tr><tr><td>lui / lei</td><td>si chiama</td></tr><tr><td>noi</td><td>ci chiamiamo</td></tr><tr><td>voi</td><td>vi chiamate</td></tr><tr><td>loro</td><td>si chiamano</td></tr></table>`,
c:["Io ___ chiamo Anna.",["mi","ti","si"],0,"io → mi."]},
{h:"Распорядок дня",
pre:`<p>Многие такие глаголы описывают день:</p>`,
ex:[["Mi sveglio alle sette.","Я просыпаюсь в семь."],["Mi alzo presto.","Я встаю рано."],["Mi vesto.","Я одеваюсь."],["Mi sento bene.","Я хорошо себя чувствую."],["Come ti trovi a Messina?","Как тебе в Мессине?"],["Ci vediamo!","Увидимся!"]],
post:`<p>svegliarsi (просыпаться), alzarsi (вставать), vestirsi (одеваться), sentirsi (чувствовать себя), trovarsi (находиться; «как тебе там»), vedersi (видеться).</p>`,
c:["Lei ___ sveglia presto.",["si","mi","ci"],0,"lei → si."]},
{h:"С «хочу» и «должен»",
pre:`<p>Два правильных варианта:</p>`,
ex:[["Devo alzarmi presto.","Мне надо рано вставать."],["Mi devo alzare presto.","То же самое."],["Voglio riposarmi.","Хочу отдохнуть."]],
post:`<p>После devo / voglio / posso частицу можно прицепить к концу начальной формы (alzar<b>mi</b>) или поставить перед глаголом (<b>mi</b> devo alzare). Оба варианта правильные.</p>`,
c:["Domani devo ___ presto. (svegliarsi, я)",["svegliarmi","svegliarsi","mi svegliare"],0,"Частица к концу и под «я»: svegliarmi."]}
],
g14:[
{h:"Как сказать о прошлом",
pre:`<p>Посмотри на конструкцию:</p>`,
ex:[["Ho mangiato.","Я поел."],["Hai parlato con Marco?","Ты говорил с Марко?"],["Abbiamo comprato il pane.","Мы купили хлеб."],["Ieri ho lavorato tanto.","Вчера я много работал."]],
post:`<p>Главное прошедшее время в разговоре (passato prossimo) состоит из двух частей: <b>avere</b> в настоящем (ho, hai, ha…) + <b>причастие</b> (mangiato). Как английское I have eaten, только им говорят и про «вчера».</p>`,
c:["«Я купил» — ___ comprato.",["Ho","Sono","Ha"],0,"io → ho + comprato."]},
{h:"Как образуется причастие",
pre:`<p>Окончание зависит от группы глагола:</p>`,
ex:[["mangiare → mangiato","съел"],["vendere → venduto","продал"],["capire → capito","понял"],["dormire → dormito","спал"]],
post:`<table><tr><td>-are →</td><td>-ato</td></tr><tr><td>-ere →</td><td>-uto</td></tr><tr><td>-ire →</td><td>-ito</td></tr></table>`,
c:["Hai ___ la lezione? (capire)",["capato","capito","capiuto"],1,"-ire → -ito."]},
{h:"Неправильные причастия",
pre:`<p>Самые частые, их нужно выучить:</p>`,
ex:[["Ho fatto la spesa.","Я сходил за продуктами. (fare)"],["Ho preso il treno.","Я сел на поезд. (prendere)"],["Ho visto il mare.","Я видел море. (vedere)"],["Ho letto il libro.","Я прочитал книгу. (leggere)"],["Ho scritto una mail.","Я написал письмо. (scrivere)"],["Ho detto di no.","Я сказал нет. (dire)"]],
post:`<table><tr><td>fare</td><td>fatto</td></tr><tr><td>prendere</td><td>preso</td></tr><tr><td>vedere</td><td>visto</td></tr><tr><td>leggere</td><td>letto</td></tr><tr><td>scrivere</td><td>scritto</td></tr><tr><td>dire</td><td>detto</td></tr><tr><td>bere</td><td>bevuto</td></tr><tr><td>aprire / chiudere</td><td>aperto / chiuso</td></tr><tr><td>perdere</td><td>perso</td></tr></table>`,
c:["Che cosa hai ___ ieri? (fare)",["fatto","fato","fauto"],0,"fare → fatto."]}
],
g15:[
{h:"Какие глаголы идут с essere",
pre:`<p>Здесь вместо avere — essere:</p>`,
ex:[["Sono andato al mare.","Я ходил на море."],["Sono arrivato ieri.","Я приехал вчера."],["Sono uscito alle otto.","Я вышел в восемь."],["Sono stato a Roma.","Я был в Риме."]],
post:`<p>С <b>essere</b> идут глаголы движения и изменения состояния: andare, venire, arrivare, partire, tornare, uscire, entrare, restare, nascere (родиться), essere (быть → stato).</p><p>Подсказка: если к глаголу нельзя задать вопрос «что?» (нельзя «andare qualcosa»), это скорее всего essere.</p>`,
c:["Ieri ___ andato in centro. (я)",["ho","sono","è"],1,"andare → с essere."]},
{h:"Причастие согласуется",
pre:`<p>Посмотри на окончания:</p>`,
ex:[["Marco è andato.","Марко ушёл."],["Giulia è andata.","Джулия ушла."],["Marco e Luca sono andati.","Марко и Лука ушли."],["Giulia e Anna sono andate.","Джулия и Анна ушли."]],
post:`<p>С essere причастие меняется, как прилагательное, по тому, кто действует:</p>
<table><tr><td>он</td><td>-o (andato)</td></tr><tr><td>она</td><td>-a (andata)</td></tr><tr><td>они (м. или смешанные)</td><td>-i (andati)</td></tr><tr><td>они (только ж.)</td><td>-e (andate)</td></tr></table>
<p>Как в русском: «ушёл / ушла / ушли».</p>`,
c:["Giulia è ___ alle sei. (arrivare)",["arrivato","arrivata","arrivati"],1,"Джулия — она → arrivata."]},
{h:"Глаголы на «-ся» в прошлом",
pre:`<p>Все возвратные глаголы тоже с essere:</p>`,
ex:[["Mi sono svegliato tardi.","Я проснулся поздно."],["Si è alzata presto.","Она встала рано."],["Ci siamo divertiti.","Мы повеселились."]],
post:`<p>Частица + essere + причастие с согласованием: <b>mi sono</b> svegliat<b>o</b> (он), <b>mi sono</b> svegliat<b>a</b> (она).</p>`,
c:["Mi ___ svegliato tardi.",["ho","sono","è"],1,"Возвратный → essere: mi sono."]}
],
g16:[
{h:"Который час",
pre:`<p>Обрати внимание на sono и è:</p>`,
ex:[["Che ore sono?","Который час?"],["Sono le tre.","Три часа."],["Sono le otto.","Восемь часов."],["È l'una.","Час."],["È mezzogiorno.","Полдень."],["È mezzanotte.","Полночь."]],
post:`<p>Часы — это «le ore», поэтому <b>sono le</b> + число: sono le due, sono le dieci. Исключения в единственном числе: <b>è l'una</b>, è mezzogiorno, è mezzanotte.</p>`,
c:["___ le quattro.",["È","Sono","Ci sono"],1,"Часы во множественном → sono le."]},
{h:"Минуты",
pre:`<p>Минуты просто прибавляем или отнимаем:</p>`,
ex:[["Sono le sette e dieci.","7:10"],["Sono le dieci e un quarto.","10:15"],["Sono le otto e mezza.","8:30"],["Sono le nove meno dieci.","8:50"],["Sono le nove meno un quarto.","8:45"]],
post:`<table><tr><td>e + минуты</td><td>после: e dieci, e venti</td></tr><tr><td>e un quarto</td><td>четверть (:15)</td></tr><tr><td>e mezza</td><td>половина (:30)</td></tr><tr><td>meno + минуты</td><td>без: le nove meno dieci = 8:50</td></tr></table>`,
c:["8:30 — Sono le otto e ___ .",["mezza","metà","quarto"],0,"половина → e mezza."]},
{h:"Во сколько?",
pre:`<p>Для времени события нужен предлог:</p>`,
ex:[["A che ora parte il treno?","Во сколько отходит поезд?"],["Alle nove.","В девять."],["All'una.","В час."],["A mezzogiorno.","В полдень."],["Dalle nove alle cinque.","С девяти до пяти."]],
post:`<p><b>A che ora?</b> — во сколько? Ответ: <b>alle</b> + число (a + le): alle nove. Но <b>all'una</b>, <b>a</b> mezzogiorno. «С… до…» — dalle… alle…</p>`,
c:["A che ora parte il treno? — ___ dieci.",["Alle","Le","A"],0,"Во сколько → alle."]}
]
};

<p><b>lo, la, li, le</b> заменяют уже названный предмет: «его, её, их». <b>ne</b> = «этого, из них» — нужен, когда называешь количество: Ne prendo due.</p>`,
q:[["Vorrei ___ pane. (немного)",["del","della","di il"],0,"pane м. р. → di + il = del."],
["Un chilo ___ pomodori.",["di","dei","del"],0,"После меры (un chilo) — просто di."],
["Compro ___ mele. (немного)",["delle","dei","della"],0,"mele ж. р. мн. ч. → di + le = delle."],
["Il prosciutto? ___ prendo, grazie.",["Lo","La","Ne"],0,"prosciutto м. р. ед. ч. → lo."],
["La mozzarella? ___ compro io.",["La","Lo","Le"],0,"mozzarella ж. р. → la."],
["Quanti limoni vuole? — ___ voglio tre.",["Ne","Li","Lo"],0,"С количеством → ne: ne voglio tre."],
["Le olive? ___ prendo.",["Le","Li","La"],0,"olive ж. р. мн. ч. → le."],
["Mezzo chilo ___ ricotta.",["di","della","dalla"],0,"После меры → di."]]});
LESSON_STEPS.g18=[
{h:"«Немного»: del, della, dei, delle",
pre:`<p>По-русски говорим «купи хлеба», «возьми яблок» — в родительном падеже, без «немного». В итальянском для этого есть <b>частичный артикль</b>: это предлог <b>di</b>, слитый с артиклем.</p>`,
ex:[["del pane","хлеба (di + il)"],["dello zucchero","сахара (di + lo)"],["della frutta","фруктов (di + la)"],["dell'acqua","воды (di + l')"],["dei pomodori","помидоров (di + i)"],["delle mele","яблок (di + le)"]],
post:`<p>Форма такая же, как у предлога di с артиклем из урока «Предлоги с артиклями». Выбираешь по артиклю слова: il pane → <b>del</b> pane, le mele → <b>delle</b> mele.</p><p>В вопросах и отрицаниях его часто опускают: Hai pane? Non ho zucchero.</p>`,
c:["Vorrei ___ acqua.",["dell'","della","del"],0,"l'acqua → di + l' = dell'."]},
{h:"Мера + di",
pre:`<p>Когда называешь точное количество или упаковку, после неё ставится просто <b>di</b>, без артикля.</p>`,
ex:[["un etto di prosciutto","100 г ветчины"],["due etti di formaggio","200 г сыра"],["un chilo di mele","килограмм яблок"],["mezzo chilo di pomodori","полкило помидоров"],["un pacco di pasta","пачка макарон"],["una bottiglia di vino","бутылка вина"],["un vasetto di olive","баночка оливок"]],

c:["Un pacco ___ pasta.",["di","della","del"],0,"После упаковки — просто di."]},
{h:"Его, её, их: lo, la, li, le",
pre:`<p>Чтобы не повторять слово, его заменяют местоимением. Оно стоит <b>перед</b> глаголом.</p>`,
ex:[["Il pane? Lo compro io.","Хлеб? Его куплю я."],["La pizza? La mangio adesso.","Пиццу? Съем её сейчас."],["I pomodori? Li prendo al mercato.","Помидоры? Возьму их на рынке."],["Le olive? Le vuole verdi o nere?","Оливки? Вам их зелёные или чёрные?"]],
post:`<table><tr><td>lo</td><td>он, его (м. р. ед. ч.)</td></tr><tr><td>la</td><td>она, её (ж. р. ед. ч.)</td></tr><tr><td>li</td><td>их (м. р. мн. ч.)</td></tr><tr><td>le</td><td>их (ж. р. мн. ч.)</td></tr></table><p>С отрицанием: Non <b>lo</b> compro. Перед гласной lo и la сокращаются: L'ho visto.</p>`,

{h:"Ne — «этого, из них»",
pre:`<p>Если называешь количество, а сам предмет уже упомянут, нужен <b>ne</b>. Без него фраза звучит неполной.</p>`,
ex:[["Quante mele? — Ne prendo quattro.","Сколько яблок? — Возьму четыре."],["Quanto formaggio? — Ne vorrei due etti.","Сколько сыра? — Мне бы 200 граммов."],["Hai dei fratelli? — Sì, ne ho due.","У тебя есть братья? — Да, два."],["Non ne ho.","У меня этого нет."]],

];

rule:`<p>Косвенные местоимения отвечают на вопрос «кому?»: <b>mi</b> мне, <b>ti</b> тебе, <b>gli</b> ему, <b>le</b> ей, <b>Le</b> Вам (вежливо), <b>ci</b> нам, <b>vi</b> вам, <b>gli</b> им. Стоят перед глаголом.</p>`,
q:[["A Marco ___ piace la pizza.",["gli","le","lo"],0,"Ему → gli."],
["A Giulia ___ piacciono i gatti.",["le","gli","la"],0,"Ей → le."],
["Signora, ___ piace il colore?",["Le","Ti","Gli"],0,"Вежливое «Вам» → Le."],
["A noi ___ piace viaggiare.",["ci","vi","ne"],0,"Нам → ci."],
["___ piacciono queste scarpe? (тебе)",["Ti","Te","Tu"],0,"Тебе → ti."],
["Questa giacca ___ sta bene. (ему)",["gli","lo","lui"],0,"Ему → gli."],
["Ai miei genitori ___ piace il mare.",["gli","le","li"],0,"Им → gli (в разговоре)."]]},
{id:"g21",t:"Сравнение: più… di, meno… che",
ex:[["Roma è più grande di Messina.","Рим больше Мессины."],["Questa giacca è meno cara di quella.","Эта куртка дешевле той."],["Il treno è più comodo dell'autobus.","Поезд удобнее автобуса."],["È più facile parlare che scrivere.","Говорить легче, чем писать."],["Sono alto come mio padre.","Я такого же роста, как мой отец."],["Questo vino è migliore.","Это вино лучше."]],
rule:`<p><b>più</b> = более, <b>meno</b> = менее. «Чем» перед существительным или местоимением — <b>di</b> (с артиклем: del, della…), перед глаголом, прилагательным или предлогом — <b>che</b>. «Такой же, как» — <b>come</b>. Особые формы: buono → <b>migliore</b> (лучше), cattivo → <b>peggiore</b>.</p>`,
q:[["Milano è più grande ___ Messina.",["di","che","come"],0,"Перед названием → di."],
["Il caffè è più forte ___ tè.",["del","che il","di"],0,"di + il tè → del tè."],
["È più bello viaggiare ___ lavorare.",["che","di","del"],0,"Сравниваем глаголы → che."],
["Questa maglia costa ___ di quella. (меньше)",["meno","più","come"],0,"меньше → meno."],
["Luca è alto ___ suo fratello. (такой же)",["come","di","che"],0,"Такой же, как → come."],
["Questa pizza è ___ di quella. (лучше)",["migliore","più buona di","meglio"],0,"buono → migliore."]]},

rule:`<p><b>Imperfetto</b> — прошедшее для привычек («раньше всегда…»), описаний и фона. Окончания одни для всех: -<b>vo</b>, -<b>vi</b>, -<b>va</b>, -<b>vamo</b>, -<b>vate</b>, -<b>vano</b> после основы с гласной глагола: parla-vo, ave-vo, dormi-vo. Неправильный в основном только essere: ero, eri, era, eravamo, eravate, erano. Fare → face-vo, bere → beve-vo, dire → dice-vo.</p>`,
