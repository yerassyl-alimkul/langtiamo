["La sera io ___ i cartoni animati. (guardare)",["guardavo","guardava","guarderò"],0,"io → guardavo."]]},
{id:"g24",t:"Imperfetto или passato prossimo?",
ex:[["Mentre leggevo, è arrivato Marco.","Пока я читал, пришёл Марко."],["Ieri pioveva, così sono rimasto a casa.","Вчера шёл дождь, поэтому я остался дома."],["Ero stanco e sono andato a letto.","Я устал и пошёл спать."],["Quando abitavo a Roma, andavo spesso al cinema.","Когда я жил в Риме, часто ходил в кино."],["Una volta sono andato a Venezia.","Однажды я съездил в Венецию."]],
rule:`<p><b>Passato prossimo</b> — событие: что случилось, один раз, закончилось (ieri, una volta, all'improvviso). <b>Imperfetto</b> — фон, состояние, привычка: какая была погода, как себя чувствовал, что обычно делал (sempre, di solito, mentre). В одном предложении: фон (imperfetto) + событие (passato prossimo).</p>`,
q:[["Mentre ___ la doccia, è suonato il telefono.",["facevo","ho fatto","faccio"],0,"Фон, длилось → imperfetto."],
["Ieri ___ a Catania. (andare, io, один раз)",["sono andato","andavo","vado"],0,"Одно событие → passato prossimo."],
["Da piccolo ___ sempre il latte. (bere)",["bevevo","ho bevuto","bevo"],0,"Привычка (sempre) → imperfetto."],
["___ stanca, perciò sono tornata a casa. (essere)",["Ero","Sono stata","Sono"],0,"Состояние, фон → ero."],
["All'improvviso ___ a piovere.",["è cominciato","cominciava","comincia"],0,"all'improvviso — событие → passato prossimo."],
["Quando ___ a Roma, prendevo la metro. (abitare)",["abitavo","ho abitato","abito"],0,"Период в прошлом, фон → abitavo."]]},
{id:"g25",t:"Condizionale: vorrei, potrei",
ex:[["Vorrei un ragazzo simpatico.","Я бы хотела приятного парня."],["Potresti aiutarmi?","Ты не мог бы мне помочь?"],["Dovresti dormire di più.","Тебе стоило бы больше спать."],["Mi piacerebbe vivere al mare.","Мне бы хотелось жить у моря."],["Al tuo posto non lo farei.","На твоём месте я бы этого не делал."],["Sarebbe bello!","Было бы здорово!"]],
rule:`<p>Condizionale = «бы»: вежливая просьба, желание, совет. Основа будущего времени + -<b>ei</b>, -<b>esti</b>, -<b>ebbe</b>, -<b>emmo</b>, -<b>este</b>, -<b>ebbero</b>. parlare → parler-ei, prendere → prender-ei, dormire → dormir-ei. Сокращённые основы: volere → <b>vorr</b>ei, potere → <b>potr</b>ei, dovere → <b>dovr</b>ei, andare → <b>andr</b>ei, avere → <b>avr</b>ei, essere → <b>sar</b>ei, fare → <b>far</b>ei, venire → <b>verr</b>ei.</p>`,
q:[["___ un caffè, per favore. (volere, io)",["Vorrei","Voglio","Volerei"],0,"Вежливо → vorrei."],
["___ chiudere la finestra? (potere, tu)",["Potresti","Potrei","Puoi essere"],0,"tu → potresti."],
["Mi ___ visitare Firenze. (piacere)",["piacerebbe","piacerei","piace bene"],0,"Мне бы хотелось → mi piacerebbe."],
["Al tuo posto io ___ con lui. (parlare)",["parlerei","parlerebbe","parlavo"],0,"io → parlerei."],
["Marco ___ studiare di più. (dovere)",["dovrebbe","dovrei","doverebbe"],0,"lui → dovrebbe."],
["Noi ___ volentieri. (venire)",["verremmo","veniremmo","verrebbero"],0,"venire → verr-emmo."],
["___ bello andare al mare! (essere)",["Sarebbe","Essrebbe","Era"],0,"essere → sarebbe."]]},
{id:"g26",t:"Sto facendo, già, non… ancora",
ex:[["Che cosa stai facendo?","Что ты сейчас делаешь?"],["Sto cucinando, ti chiamo dopo.","Я готовлю, перезвоню потом."],["Hai già comprato i biglietti?","Ты уже купил билеты?"],["Non ho ancora deciso.","Я ещё не решил."],["Il film? L'ho visto ieri.","Фильм? Я его посмотрел вчера."],["Le chiavi? Le ho dimenticate!","Ключи? Я их забыл!"]],
rule:`<p><b>stare + gerundio</b> — действие прямо сейчас: -are → -<b>ando</b> (parlando), -ere/-ire → -<b>endo</b> (leggendo, dormendo); fare → facendo, bere → bevendo, dire → dicendo. <b>già</b> — уже, <b>non… ancora</b> — ещё не. В passato prossimo местоимения lo/la/li/le стоят перед avere, и причастие согласуется: l'ho visto (его), l'ho vista (её), li ho visti, le ho viste.</p>`,
q:[["Non posso parlare, ___ lavorando.",["sto","sono","ho"],0,"stare + gerundio: sto lavorando."],
["Che cosa ___ facendo i bambini?",["stanno","stano","sono"],0,"loro → stanno."],
["Sto ___ un libro. (leggere)",["leggendo","leggando","letto"],0,"-ere → -endo."],
["Hai ___ mangiato? — Sì, alle sette.",["già","ancora","mai"],0,"уже → già."],
["Non ho ___ finito. (ещё)",["ancora","già","più"],0,"ещё не → non… ancora."],
["La pizza? L'ho ___ tutta! (mangiare)",["mangiata","mangiato","mangiati"],0,"la pizza ж. р. → mangiata."],
["I biglietti? ___ ho comprati ieri.",["Li","Le","Lo"],0,"biglietti м. р. мн. ч. → li, comprati."]]}
);
LESSONS.push(
{id:"g27",t:"Не делай! Скажи мне!",
ex:[["Non mangiare troppo!","Не ешь слишком много!"],["Non preoccuparti.","Не волнуйся."],["Assaggialo!","Попробуй его!"],["Dimmi la verità.","Скажи мне правду."],["Fammi vedere!","Дай посмотреть!"],["Va' piano!","Езжай потише!"]],
rule:`<p>Запрет для «ты»: <b>non + инфинитив</b>: non mangiare, non bere. Для «вы»: non mangiate. Короткие неправильные формы: andare → <b>va'</b>, fare → <b>fa'</b>, dare → <b>da'</b>, dire → <b>di'</b>, stare → <b>sta'</b>, essere → <b>sii</b>, avere → <b>abbi</b>. Местоимения <b>приклеиваются</b> к повелительному: prendilo, assaggiala, dimmi. После va', fa', di', da', sta' согласная удваивается: dimmi, fammi, dammi, vacci.</p>`,
q:[["___ il sale, è già salato! (не клади)",["Non mettere","Non metti","Non mette"],0,"Запрет для ты → non + инфинитив."],
["La torta è buona, ___! (попробуй её)",["assaggiala","la assaggia","assaggiarla"],0,"Местоимение приклеивается: assaggiala."],
["___ la verità! (dire, ты)",["Di'","Dici","Dica"],0,"dire → di'."],
["___ vedere la foto! (дай мне посмотреть)",["Fammi","Mi fa","Fami"],0,"fa' + mi → fammi."],
["Ragazzi, non ___ tardi! (tornare)",["tornate","tornare","tornino"],0,"Для вы: non tornate."],
["___ tranquillo, va tutto bene! (stare, ты)",["Sta'","Stai essere","Stia"],0,"stare → sta'."],
["Il pane? ___ due, per favore! (дай мне их)",["Dammene","Dami","Mi da"],0,"da' + me + ne → dammene."]]},
{id:"g28",t:"Вежливое повелительное (Lei)",
ex:[["Prenda questa medicina.","Принимайте это лекарство."],["Scusi, può ripetere?","Извините, можете повторить?"],["Mi dica!","Слушаю вас! (Скажите мне)"],["Venga domani alle nove.","Приходите завтра в девять."],["Non beva alcol.","Не пейте алкоголь."],["Si accomodi!","Присаживайтесь!"]],
rule:`<p>Врач, продавец, незнакомый человек говорят на «Lei». Форма меняет гласную: -are → -<b>i</b> (scusi, guardi), -ere/-ire → -<b>a</b> (prenda, senta, dorma). Частые неправильные: <b>faccia</b>, <b>vada</b>, <b>venga</b>, <b>dica</b>, <b>beva</b>, <b>stia</b>, <b>abbia</b>, <b>sia</b>. Отрицание: non + та же форма (non beva). Местоимения стоят перед глаголом: <b>mi</b> dica, <b>si</b> accomodi. Сравнение: buono → <b>migliore</b>, bene → <b>meglio</b> (Sto meglio — мне лучше).</p>`,
q:[["Dottore, ___ ! (dire, Lei)",["mi dica","dimmi","mi dice"],0,"Lei → mi dica."],
["___ questa medicina due volte al giorno. (prendere, Lei)",["Prenda","Prendi","Prende"],0,"-ere → -a: prenda."],
["___ , dov'è la farmacia? (scusare, Lei)",["Scusi","Scusa","Scuse"],0,"-are → -i: scusi."],
["Non ___ caffè la sera. (bere, Lei)",["beva","bevi","bere"],0,"bere → beva."],
["___ pure, signora! (accomodarsi)",["Si accomodi","Accomodati","Si accomoda"],0,"Вежливо: si accomodi."],
["Oggi sto ___ di ieri. (лучше)",["meglio","migliore","più bene"],0,"bene → meglio."],
["___ a destra, poi dritto. (andare, Lei)",["Vada","Va'","Vai"],0,"andare → vada."]]},
{id:"g29",t:"Будущее время и «если»",
ex:[["Domani lavorerò fino alle sei.","Завтра я буду работать до шести."],["L'anno prossimo andremo in Sicilia.","В следующем году мы поедем на Сицилию."],["Se trovo lavoro, resterò a Messina.","Если найду работу, останусь в Мессине."],["Sarà vero?","Неужели правда? (наверное)"],["Che ore sono? — Saranno le otto.","Который час? — Наверное, восемь."],["Ci metto mezz'ora.","У меня это занимает полчаса."]],
rule:`<p><b>Futuro semplice</b>: -are и -ere → основа на -er, -ire → на -ir, + окончания -<b>ò</b>, -<b>ai</b>, -<b>à</b>, -<b>emo</b>, -<b>ete</b>, -<b>anno</b>: lavorer-ò, prender-ò, partir-ò. Неправильные основы как в condizionale: sarò, avrò, andrò, farò, potrò, vorrò, verrò, dovrò. Будущее ещё выражает догадку: Sarà stanco — наверное, он устал. <b>Se</b> + настоящее или будущее → будущее: Se piove, resto a casa. <b>metterci</b> — сколько времени уходит: Ci metto dieci minuti.</p>`,
q:[["Domani ___ un colloquio. (avere, io)",["avrò","averò","ho avuto"],0,"avere → avr-ò."],
["L'anno prossimo ___ a Milano. (andare, noi)",["andremo","anderemo","andiamo stati"],0,"andare → andr-emo."],
["Se ___ bel tempo, andiamo al mare. (fare)",["fa","farà stato","faceva"],0,"После se — настоящее: se fa bel tempo."],
["Quando ___ la laurea? (prendere, tu)",["prenderai","prendrai","prenderà"],0,"tu → prender-ai."],
["Marco non risponde. ___ in riunione. (наверное)",["Sarà","Sono","Sarei"],0,"Догадка → futuro: sarà."],
["Per andare a Catania ___ un'ora e mezza. (у меня занимает)",["ci metto","ci vuole io","metto"],0,"metterci: ci metto."],
["I miei amici ___ a trovarmi. (venire)",["verranno","veniranno","vengano"],0,"venire → verr-anno."]]},
{id:"g30",t:"Рассказ: mentre, durante, stavo per",
ex:[["Mentre aspettavo il treno, ho conosciuto Sara.","Пока я ждал поезд, я познакомился с Сарой."],["Durante la cena abbiamo parlato tanto.","За ужином мы много говорили."],["Stavo per uscire quando ha chiamato.","Я как раз собирался выйти, когда он позвонил."],["All'inizio ero timido, però poi…","Сначала я стеснялся, но потом…"],["Ho dovuto lavorare.","Мне пришлось работать."],["Sono dovuto partire presto.","Мне пришлось уехать рано."]],
rule:`<p><b>mentre</b> + глагол (пока, в то время как), <b>durante</b> + существительное (во время). <b>stare per</b> + инфинитив — «вот-вот, собирался»: Stavo per dormire. Связки рассказа: all'inizio, poi, quindi, però, perché, quando, alla fine, finalmente. Модальные (dovere, potere, volere) в passato prossimo берут вспомогательный глагол от следующего глагола: ho dovuto lavorare, но <b>sono</b> dovuto andare.</p>`,
q:[["___ il film ho dormito. (во время)",["Durante","Mentre","Quando"],0,"Перед существительным → durante."],
["___ cucinavo, ascoltavo la radio. (пока)",["Mentre","Durante","Per"],0,"Перед глаголом → mentre."],
["Il treno sta ___ partire!",["per","a","di"],0,"stare per + инфинитив."],
["Ieri ___ dovuto studiare tutto il giorno.",["ho","sono","sto"],0,"dovere + studiare (с avere) → ho dovuto."],
["Lucia ___ dovuta tornare a casa.",["è","ha","sta"],0,"tornare идёт с essere → è dovuta tornare."],
["Ero stanco, ___ sono andato a letto. (поэтому)",["quindi","però","mentre"],0,"поэтому → quindi."],
["Volevo venire, ___ non ho potuto. (но)",["però","quindi","perché"],0,"но → però."]]},
{id:"g31",t:"Congiuntivo: penso che sia",
ex:[["Penso che sia una bella casa.","Думаю, что это красивый дом."],["Credo che costi troppo.","Мне кажется, это стоит слишком дорого."],["Spero che tu stia bene.","Надеюсь, у тебя всё хорошо."],["È importante che la casa abbia il balcone.","Важно, чтобы у дома был балкон."],["Voglio che venga anche tu.","Я хочу, чтобы ты тоже пришёл."],["Magari!","Если бы! / Хорошо бы!"]],
rule:`<p><b>Congiuntivo</b> нужен после мнения, надежды, желания, важности: penso che, credo che, spero che, voglio che, è importante che, bisogna che. Если субъект тот же, без che и с инфинитивом: Penso di partire. Формы (io = tu = lui): -are → -<b>i</b> (parli), -ere/-ire → -<b>a</b> (prenda, dorma); noi -iamo, voi -iate, loro -ino / -ano. Неправильные: essere → <b>sia</b> (siano), avere → <b>abbia</b>, fare → <b>faccia</b>, andare → <b>vada</b>, stare → <b>stia</b>, potere → <b>possa</b>.</p>`,
q:[["Penso che questa casa ___ troppo piccola. (essere)",["sia","è","essere"],0,"penso che + congiuntivo → sia."],
["Spero che tu ___ bene. (stare)",["stia","stai","stare"],0,"stare → stia."],
["Credo che l'affitto ___ 600 euro. (costare)",["costi","costa","costare"],0,"-are → -i: costi."],
["È importante che la camera ___ luminosa. (essere)",["sia","è","fosse stata"],0,"È importante che + sia."],
["Voglio che i bambini ___ presto. (dormire)",["dormano","dormono","dormino"],0,"-ire → loro -ano: dormano."],
["Penso ___ restare a casa. (я сам)",["di","che","a"],0,"Тот же субъект → di + инфинитив."],
["Credo che Marco ___ una macchina nuova. (avere)",["abbia","ha","avesse"],0,"avere → abbia."]]},
{id:"g32",t:"Sapere и conoscere, ci vuole",
ex:[["Conosci Palermo?","Ты знаешь (бывал в) Палермо?"],["Sai a che ora parte il treno?","Знаешь, во сколько отходит поезд?"],["Non sapevo che eri qui!","Я не знал, что ты здесь!"],["Ho conosciuto Julie a Roma.","Я познакомился с Джули в Риме."],["L'ho saputo ieri.","Я узнал это вчера."],["Ci vuole un'ora in treno.","На поезде нужен час."],["Ci vogliono tre ore.","Нужно три часа."]],
rule:`<p><b>conoscere</b> — знать человека или место; <b>sapere</b> — знать факт или уметь (So nuotare — умею плавать). В прошлом смысл меняется: <b>ho conosciuto</b> = познакомился, <b>conoscevo</b> = был знаком; <b>ho saputo</b> = узнал (новость), <b>sapevo</b> = знал. <b>ci vuole</b> + одно (ci vuole un'ora), <b>ci vogliono</b> + много (ci vogliono due ore) — сколько нужно времени или вещей вообще. А <b>ci metto</b> — сколько трачу я.</p>`,
q:[["___ mia sorella? (знаешь, ты)",["Conosci","Sai","Sapi"],0,"Человека → conoscere."],
["___ dov'è la stazione? (знаешь, ты)",["Sai","Conosci","Conosce"],0,"Факт → sapere."],
["Ieri ___ Paolo a una festa. (познакомился)",["ho conosciuto","conoscevo","ho saputo"],0,"Познакомился → ho conosciuto."],
["Non ___ che eri in Italia! (не знал)",["sapevo","ho saputo","conoscevo"],0,"Знал/не знал (состояние) → sapevo."],
["Per Roma ___ sette ore di treno.",["ci vogliono","ci vuole","ci metto"],0,"Много (ore) → ci vogliono."],
["___ un passaporto per viaggiare.",["Ci vuole","Ci vogliono","Ci metti"],0,"Одно → ci vuole."],
["Tu sai ___ ? (плавать)",["nuotare","nuoti","a nuotare"],0,"sapere + инфинитив = уметь."]]}
);
Object.assign(LESSON_STEPS,{
g20:[
{h:"«Кому?» — косвенные местоимения",
pre:`<p>В русском «мне, тебе, ему» — это дательный падеж. В итальянском для этого короткие слова, которые стоят <b>перед глаголом</b>.</p>`,
ex:[["Mi piace.","Мне нравится."],["Ti scrivo domani.","Напишу тебе завтра."],["Gli telefono stasera.","Позвоню ему вечером."],["Le compro un regalo.","Куплю ей подарок."],["Ci serve aiuto.","Нам нужна помощь."],["Vi mando la foto.","Пришлю вам фото."]],
post:`<table><tr><td>mi</td><td>мне</td></tr><tr><td>ti</td><td>тебе</td></tr><tr><td>gli</td><td>ему (и им — в разговоре)</td></tr><tr><td>le / Le</td><td>ей / Вам (вежливо, с большой буквы на письме)</td></tr><tr><td>ci</td><td>нам</td></tr><tr><td>vi</td><td>вам</td></tr></table>`,
c:["Telefono a Marco → ___ telefono.",["Gli","Le","Lo"],0,"a Marco = ему → gli."]},
{h:"Piacere с местоимениями",
pre:`<p>Piacere работает как русское «нравиться»: нравится <b>что-то</b> (подлежащее) <b>кому-то</b>. Поэтому глагол согласуется с тем, что нравится.</p>`,
ex:[["Ti piace il vestito?","Тебе нравится платье?"],["Gli piacciono le scarpe.","Ему нравятся туфли."],["A lei non piace il rosso.","Ей не нравится красный."],["Le piace, signora?","Вам нравится, синьора?"]],
post:`<p>Одна вещь или действие → <b>piace</b>, несколько вещей → <b>piacciono</b>. Для выделения можно сказать полной формой: <b>a me</b> piace, <b>a te</b>, <b>a lui</b>, <b>a lei</b>, <b>a noi</b>… «A me sì, a te no» — мне да, тебе нет.</p>`,
c:["A Giulia ___ i colori scuri.",["piacciono","piace","piaci"],0,"colori — мн. ч. → piacciono."]},
{h:"Stare bene и servire в магазине",
pre:`<p>Две полезные конструкции работают так же, как piacere:</p>`,
ex:[["Questa giacca ti sta bene.","Эта куртка тебе идёт."],["Questi pantaloni mi stanno stretti.","Эти брюки мне узки."],["Le serve una taglia più grande?","Вам нужен размер побольше?"],["Mi serve un regalo per mia moglie.","Мне нужен подарок для жены."]],
post:`<p><b>stare bene / male a qualcuno</b> — идти / не идти кому-то. <b>servire a qualcuno</b> — быть нужным кому-то. Глагол снова согласуется с вещью: la giacca ti sta, i pantaloni ti stanno.</p>`,
c:["Queste scarpe ___ stanno benissimo! (тебе)",["ti","tu","te"],0,"Тебе → ti."]}
],
g21:[
{h:"Больше и меньше: più, meno",
pre:`<p>Сравнение строится словами <b>più</b> (более) и <b>meno</b> (менее) перед прилагательным.</p>`,
ex:[["più grande","больше"],["più caro","дороже"],["meno caro","дешевле (менее дорогой)"],["più comodo","удобнее"],["meno difficile","не такой трудный"]],
post:`<p>Окончание прилагательного по-прежнему согласуется: una gonna più cara, dei pantaloni più cari.</p>`,
c:["Questa gonna è ___ corta. (короче)",["più","meno","molto"],0,"короче = более короткая → più corta."]},
{h:"«Чем»: di или che",
pre:`<p>«Чем» переводится двумя способами. Это самое трудное в теме.</p>`,
ex:[["Roma è più grande di Messina.","перед названием → di"],["Il mio telefono è più nuovo del tuo.","перед существительным с артиклем → del"],["Sono più alto di te.","перед местоимением → di"],["È più facile leggere che parlare.","сравниваем два глагола → che"],["È più bello che comodo.","два прилагательных → che"],["Fa più caldo a Messina che a Milano.","два места с предлогом → che"]],
post:`<p>Правило: если после «чем» идёт <b>кто-то или что-то</b> (имя, существительное, местоимение) — <b>di</b>. Если сравниваешь <b>действия, качества или места с предлогом</b> — <b>che</b>.</p>`,
c:["Preferisco camminare ___ prendere l'autobus.",["che","di","del"],0,"Два глагола → che."]},
{h:"Как и особые формы",
pre:`<p>Равенство и несколько неправильных сравнений:</p>`,
ex:[["È alto come me.","Он такого же роста, как я."],["Costa come quella.","Стоит столько же, как та."],["Questo è migliore.","Это лучше. (buono → migliore)"],["Il tempo è peggiore di ieri.","Погода хуже, чем вчера."],["Questa è la giacca più bella del negozio.","Это самая красивая куртка в магазине."]],
post:`<p><b>come</b> — как, такой же. buono → <b>migliore</b>, cattivo → <b>peggiore</b>. Самый: артикль + più + прилагательное + <b>di</b>: la più bella <b>del</b> negozio.</p>`,
c:["È ___ ristorante della città. (самый хороший)",["il migliore","il più migliore","il meglio"],0,"il migliore — самый лучший."]}
],
g22:[
{h:"Совет другу: формы на «ты»",
pre:`<p>Повелительное наклонение — «сделай!». Для «ты» всё просто:</p>`,
ex:[["guardare → guarda!","смотри!"],["provare → prova!","примерь! попробуй!"],["prendere → prendi!","возьми!"],["scrivere → scrivi!","напиши!"],["sentire → senti!","послушай!"],["aprire → apri!","открой!"]],
post:`<p>-are → <b>-a</b>, -ere и -ire → <b>-i</b>. Не перепутай: guarda (ты, повелительное) и guardi (ты, настоящее — «ты смотришь»).</p>`,
c:["___ questa camicia! (provare)",["Prova","Provi","Prove"],0,"-are → -a."]},
{h:"Для нескольких и «давайте»",
pre:`<p>Для «вы» и «мы» повелительное совпадает с настоящим временем:</p>`,
ex:[["Guardate!","Смотрите! (вы)"],["Prendete un caffè!","Выпейте кофе!"],["Andiamo!","Пойдём!"],["Proviamo questo!","Давай попробуем это!"]],
post:`<p>Слова-помощники в магазине: <b>Senti</b>/<b>Scusa</b> — слушай, извини (другу), <b>Guarda</b> — смотри, <b>Dai!</b> — да ладно, давай!</p>`,
c:["Ragazzi, ___ ! (andare, вы)",["andate","vanno","va'"],0,"Вы → andate."]}
],
g23:[
{h:"Зачем второе прошедшее время",
pre:`<p>В русском есть «делал» и «сделал». В итальянском похоже: <b>passato prossimo</b> — сделал (факт, результат), <b>imperfetto</b> — делал, бывало, обычно делал.</p>`,
ex:[["Da piccolo giocavo a calcio.","В детстве я играл в футбол (регулярно)."],["Ieri ho giocato a calcio.","Вчера я сыграл в футбол (один раз)."],["Mio nonno era molto alto.","Мой дедушка был очень высоким (описание)."]],
post:`<p>Imperfetto — для <b>привычек</b> в прошлом, <b>описаний</b> людей, мест, погоды, чувств и для <b>фона</b> истории.</p>`,
c:["Da bambino ___ sempre dalla nonna. (andare)",["andavo","sono andato"],0,"Привычка (sempre) → imperfetto."]},
{h:"Как образуется",
pre:`<p>Хорошая новость: окончания одинаковые для всех трёх групп.</p>`,
ex:[["parlare → parlavo","я говорил"],["avere → avevi","ты имел"],["dormire → dormiva","он спал"],["andare → andavamo","мы ходили"],["leggere → leggevate","вы читали"],["vivere → vivevano","они жили"]],
post:`<table><tr><td>io</td><td>-vo</td></tr><tr><td>tu</td><td>-vi</td></tr><tr><td>lui/lei</td><td>-va</td></tr><tr><td>noi</td><td>-vamo</td></tr><tr><td>voi</td><td>-vate</td></tr><tr><td>loro</td><td>-vano</td></tr></table><p>Отбрось -re у инфинитива и добавь окончание: parla-re → parla-vo.</p>`,
c:["Noi ___ in centro. (abitare)",["abitavamo","abitavano"],0,"noi → -vamo."]},
{h:"Неправильные",
pre:`<p>Их мало:</p>`,
ex:[["essere: ero, eri, era, eravamo, eravate, erano","был"],["fare → facevo","делал"],["bere → bevevo","пил"],["dire → dicevo","говорил"],["Quando ero piccolo, facevo nuoto.","Когда я был маленьким, ходил на плавание."]],
post:`<p>Слова-подсказки для imperfetto: <b>da piccolo</b> (в детстве), <b>sempre</b>, <b>di solito</b> (обычно), <b>ogni giorno / ogni estate</b>, <b>spesso</b> (часто), <b>una volta</b> в значении «раньше».</p>`,
c:["Mia madre ___ insegnante. (essere)",["era","erava","è stata"],0,"essere → era."]}
],
g24:[
{h:"Событие или фон?",
pre:`<p>Представь фильм: <b>imperfetto</b> — декорации и то, что длится; <b>passato prossimo</b> — то, что произошло в кадре.</p>`,
ex:[["Era sera e pioveva.","Был вечер, шёл дождь. (декорации)"],["All'improvviso è entrato un uomo.","Вдруг вошёл мужчина. (событие)"],["Mentre parlavamo, è suonato il telefono.","Пока мы разговаривали, зазвонил телефон."]],
post:`<p>Вопрос себе: «Это случилось?» → passato prossimo. «Это было, длилось, бывало?» → imperfetto.</p>`,
c:["Mentre ___ , è arrivato l'autobus. (aspettare, io)",["aspettavo","ho aspettato"],0,"Длилось → imperfetto."]},
{h:"Слова-подсказки",
pre:`<p>Многие слова подсказывают время:</p>`,
ex:[["ieri, una volta, all'improvviso, alle tre","→ passato prossimo"],["sempre, di solito, ogni giorno, spesso, mentre","→ imperfetto"],["Ieri sono stato male.","Вчера мне было плохо (весь вчерашний день как событие)."],["Stavo male, perciò non sono uscito.","Мне было плохо (состояние), поэтому я не вышел (событие)."]],
post:`<p>Иногда оба варианта правильны, но смысл разный: «Ieri ero stanco» — описываю состояние, «Ieri sono stato stanco tutto il giorno» — подвожу итог дня.</p>`,
c:["Di solito ___ a piedi. (andare, io)",["andavo","sono andato"],0,"di solito → imperfetto."]}
],
g25:[
{h:"Вежливость и желания",
pre:`<p>Condizionale = частица «бы». Ты уже знаешь <b>vorrei</b> — я бы хотел. Это самая вежливая форма просьбы.</p>`,
ex:[["Vorrei un'informazione.","Мне нужна информация (я бы хотел)."],["Potrebbe aiutarmi?","Не могли бы Вы мне помочь?"],["Mi piacerebbe imparare a ballare.","Мне бы хотелось научиться танцевать."],["Preferirei restare a casa.","Я бы предпочёл остаться дома."]],
post:`<p>Используется для просьб, желаний, советов (dovresti — тебе стоило бы) и предположений.</p>`,
c:["___ un bicchiere d'acqua, per favore. (вежливо)",["Vorrei","Voglio"],0,"Вежливо → vorrei."]},
{h:"Формы",
pre:`<p>Основа: инфинитив без последней -e, у -are гласная a меняется на e: parlare → parler-, prendere → prender-, dormire → dormir-.</p>`,
ex:[["io parlerei","я бы говорил"],["tu prenderesti","ты бы взял"],["lui dormirebbe","он бы спал"],["noi andremmo","мы бы пошли"],["voi fareste","вы бы сделали"],["loro sarebbero","они были бы"]],
post:`<table><tr><td>io</td><td>-ei</td></tr><tr><td>tu</td><td>-esti</td></tr><tr><td>lui/lei</td><td>-ebbe</td></tr><tr><td>noi</td><td>-emmo</td></tr><tr><td>voi</td><td>-este</td></tr><tr><td>loro</td><td>-ebbero</td></tr></table><p>Короткие основы: vorr-, potr-, dovr-, andr-, avr-, sar-, far-, verr-, berr-.</p>`,
c:["Tu ___ con me al cinema? (venire)",["verresti","veniresti"],0,"venire → verr-esti."]},
{h:"Описание человека",
pre:`<p>В этом модуле condizionale помогает говорить об идеальном человеке и характере:</p>`,
ex:[["Il mio coinquilino ideale sarebbe ordinato.","Мой идеальный сосед был бы аккуратным."],["Non vorrei un capo severo.","Я бы не хотел строгого начальника."],["Al tuo posto ci penserei.","На твоём месте я бы подумал."]],
post:`<p>Полезно рядом: <b>né… né</b> — ни… ни (Non è né alto né basso), <b>qualcuno</b> — кто-то, <b>nessuno</b> — никто (Non conosco nessuno).</p>`,
c:["Non è ___ bello ___ brutto.",["né… né","o… o"],0,"ни… ни → né… né."]}
],
g26:[
{h:"Прямо сейчас: stare + gerundio",
pre:`<p>«Я сейчас готовлю» по-итальянски можно сказать просто «cucino», но если важно, что именно <b>в этот момент</b>, используй stare + gerundio.</p>`,
ex:[["Sto mangiando.","Я ем (прямо сейчас)."],["Stai dormendo?","Ты спишь?"],["Sta piovendo.","Идёт дождь."],["Stiamo arrivando!","Мы уже подъезжаем!"],["State studiando?","Вы занимаетесь?"],["Stanno uscendo.","Они выходят."]],
post:`<p>stare: sto, stai, sta, stiamo, state, stanno + gerundio: -are → -<b>ando</b>, -ere/-ire → -<b>endo</b>. Неправильные: fare → facendo, bere → bevendo, dire → dicendo.</p>`,
c:["Che cosa ___ facendo? (tu)",["stai","sei"],0,"tu → stai."]},
{h:"Già и non… ancora",
pre:`<p>Уже / ещё не — с passato prossimo:</p>`,
ex:[["Hai già mangiato?","Ты уже поел?"],["Sì, ho già mangiato.","Да, уже поел."],["No, non ho ancora mangiato.","Нет, ещё не ел."],["Non sono ancora arrivati.","Они ещё не приехали."]],
post:`<p>Слова стоят между вспомогательным глаголом и причастием: ho <b>già</b> visto, non ho <b>ancora</b> visto.</p>`,
c:["Non ho ___ deciso.",["ancora","già"],0,"ещё не → non… ancora."]},
{h:"Lo, la в прошедшем",
pre:`<p>Если перед avere стоит lo/la/li/le, причастие согласуется с ним, как прилагательное.</p>`,
ex:[["Il film? L'ho visto.","Фильм? Видел его."],["La mostra? L'ho vista.","Выставку? Видел её."],["I biglietti? Li ho presi.","Билеты? Я их взял."],["Le foto? Le ho mandate.","Фото? Я их отправил."]],
post:`<p>lo/la перед гласной → <b>l'</b>. Окончание причастия: lo → -o, la → -a, li → -i, le → -e.</p>`,
c:["Le chiavi? Le ho ___ . (perdere)",["perse","perso"],0,"le (ж. мн.) → perse."]}
],
g27:[
{h:"Запрет: non + инфинитив",
pre:`<p>Сказать другу «не делай» очень просто — non + неопределённая форма:</p>`,
ex:[["Non mangiare troppo dolce.","Не ешь много сладкого."],["Non bere freddo!","Не пей холодное!"],["Non dimenticare il pane!","Не забудь хлеб!"],["Non toccate!","Не трогайте! (вы — обычная форма)"]],
post:`<p>Только для «ты» берётся инфинитив. Для «вы»: non + toccate.</p>`,
c:["___ il telefono a tavola! (не используй)",["Non usare","Non usi"],0,"ты → non + инфинитив."]},
{h:"Короткие неправильные формы",
pre:`<p>Пять частых глаголов имеют короткое повелительное:</p>`,
ex:[["andare → va'","иди"],["fare → fa'","сделай"],["dare → da'","дай"],["dire → di'","скажи"],["stare → sta'","будь, стой"],["essere → sii, avere → abbi","будь / имей"]],
post:`<p>В разговоре часто говорят и полные формы: vai, fai, dai, stai. «Sii gentile!» — будь вежлив. «Abbi pazienza!» — потерпи.</p>`,
c:["___ attenzione! (fare, ты)",["Fa'","Fai essere"],0,"fare → fa' (или fai)."]},
{h:"Местоимения приклеиваются",
pre:`<p>С повелительным на «ты/вы/мы» местоимения пишутся вместе с глаголом, в конце:</p>`,
ex:[["Prendilo!","Возьми его!"],["Assaggiala!","Попробуй её!"],["Dimmi!","Скажи мне!"],["Fammi un favore.","Сделай мне одолжение."],["Mangiane un po'!","Съешь немного (этого)!"],["Non preoccuparti!","Не волнуйся!"]],
post:`<p>После коротких форм va', fa', da', di', sta' согласная удваивается: di' + mi → <b>dimmi</b>, fa' + lo → <b>fallo</b>. Исключение: gli не удваивается (digli).</p>`,
c:["La ricetta? ___ ! (скажи мне её)",["Dimmela","Dimela"],0,"di' + me + la → dimmela."]}
],
g28:[
{h:"Вежливая просьба на «Lei»",
pre:`<p>У врача, в аптеке, в офисе говорят на «Lei», и повелительное звучит иначе. Гласные как будто «меняются местами»:</p>`,
ex:[["(tu) guarda → (Lei) guardi","посмотрите"],["(tu) scusa → (Lei) scusi","извините"],["(tu) prendi → (Lei) prenda","возьмите, принимайте"],["(tu) senti → (Lei) senta","послушайте"],["(tu) apri → (Lei) apra","откройте"]],
post:`<p>-are → <b>-i</b>, -ere/-ire → <b>-a</b>. Это та же форма, что congiuntivo, который ты выучишь в последнем модуле.</p>`,
c:["___ la bocca, per favore. (aprire, Lei)",["Apra","Apri"],0,"-ire → -a."]},
{h:"Частые неправильные",
pre:`<p>Их ты будешь слышать каждый день:</p>`,
ex:[["Mi dica!","Слушаю вас! (dire)"],["Venga!","Проходите! (venire)"],["Vada sempre dritto.","Идите всё прямо. (andare)"],["Faccia attenzione.","Будьте внимательны. (fare)"],["Stia tranquillo.","Не волнуйтесь. (stare)"],["Non beva alcolici.","Не пейте алкоголь. (bere)"]],
post:`<p>Местоимения в вежливой форме стоят <b>перед</b> глаголом: <b>Mi</b> dica, <b>Si</b> accomodi, <b>La</b> prenda.</p>`,
c:["___ pure! (accomodarsi, Lei)",["Si accomodi","Accomodati"],0,"Lei → si accomodi."]},
{h:"Лучше: meglio и migliore",
pre:`<p>Когда говорим о здоровье:</p>`,
ex:[["Come sta? — Meglio, grazie.","Как Вы? — Лучше, спасибо."],["Sto meglio di ieri.","Мне лучше, чем вчера."],["Questa medicina è migliore.","Это лекарство лучше."],["Il rimedio migliore è dormire.","Лучшее средство — сон."]],
post:`<p><b>meglio</b> — наречие (как? лучше), сравнение от bene. <b>migliore</b> — прилагательное (какой? лучший), сравнение от buono.</p>`,
c:["Oggi sto ___ .",["meglio","migliore"],0,"stare bene → meglio."]}
],
g29:[
{h:"Будущее время",
pre:`<p>Futuro semplice — одно слово вместо русского «буду делать / сделаю».</p>`,
ex:[["lavorare → lavorerò","я буду работать"],["prendere → prenderai","ты возьмёшь"],["partire → partirà","он уедет"],["finire → finiremo","мы закончим"],["scrivere → scriverete","вы напишете"],["cominciare → cominceranno","они начнут"]],
post:`<table><tr><td>io</td><td>-ò</td></tr><tr><td>tu</td><td>-ai</td></tr><tr><td>lui/lei</td><td>-à</td></tr><tr><td>noi</td><td>-emo</td></tr><tr><td>voi</td><td>-ete</td></tr><tr><td>loro</td><td>-anno</td></tr></table><p>У -are гласная a → e: lavorare → lavor<b>e</b>rò. Неправильные основы: sarò, avrò, andrò, farò, potrò, dovrò, vorrò, verrò.</p>`,
c:["Domani ___ tardi. (finire, io)",["finirò","finerò"],0,"-ire → finir-ò."]},
{h:"Догадка и «если»",
pre:`<p>Будущее время ещё выражает предположение о настоящем:</p>`,
ex:[["Dov'è Marco? — Sarà al lavoro.","Где Марко? — Наверное, на работе."],["Avrà trent'anni.","Ему, наверное, лет тридцать."],["Se ho tempo, ti chiamo.","Если будет время, позвоню."],["Se finirò presto, verrò.","Если закончу рано, приду."]],
post:`<p>После <b>se</b> в разговоре чаще ставят настоящее: Se piove, resto a casa. В русском «если будет дождь» — с будущим, в итальянском так говорить не обязательно.</p>`,
c:["Se ___ lavoro, resto in Italia. (trovare, io)",["trovo","troverei"],0,"se + настоящее."]},
{h:"Работа: bisogna, ci metto",
pre:`<p>Полезные конструкции для разговора о работе:</p>`,
ex:[["Bisogna parlare inglese.","Нужно говорить по-английски."],["Bisogna avere esperienza.","Нужен опыт."],["Ci metto venti minuti per arrivare.","Мне добираться двадцать минут."],["Quanto ci metti?","Сколько у тебя уходит?"]],
post:`<p><b>bisogna</b> + инфинитив — нужно (вообще, для всех). <b>metterci</b> — тратить время: ci metto, ci metti, ci mette…</p>`,
c:["Per questo lavoro ___ sapere l'inglese.",["bisogna","bisogno"],0,"Нужно (безлично) → bisogna."]}
],
g30:[
{h:"Mentre и durante",
pre:`<p>Оба значат «во время», но после них разные слова:</p>`,
ex:[["Mentre mangiavo, guardavo la TV.","Пока я ел, смотрел ТВ."],["Durante la cena guardavo la TV.","Во время ужина смотрел ТВ."],["Mentre lui parlava, lei sorrideva.","Пока он говорил, она улыбалась."],["Durante il viaggio ho letto un libro.","В дороге я прочитал книгу."]],
post:`<p><b>mentre</b> + глагол (обычно imperfetto), <b>durante</b> + существительное.</p>`,
c:["___ le vacanze ho conosciuto Luca.",["Durante","Mentre"],0,"le vacanze — существительное → durante."]},
{h:"Stavo per… — «как раз собирался»",
pre:`<p><b>stare per</b> + инфинитив — действие, которое вот-вот произойдёт:</p>`,
ex:[["Il film sta per cominciare.","Фильм сейчас начнётся."],["Stavo per uscire quando hai chiamato.","Я уже собирался выходить, когда ты позвонил."],["Stiamo per partire.","Мы вот-вот уезжаем."]],
post:`<p>В рассказе о прошлом stare стоит в imperfetto: stavo, stavi, stava… per + инфинитив.</p>`,
c:["Il treno sta ___ partire.",["per","a"],0,"stare per."]},
{h:"Как рассказывать историю",
pre:`<p>Связки делают рассказ живым:</p>`,
ex:[["All'inizio…","Сначала…"],["Poi… / Dopo…","Потом…"],["Però…","Но…"],["Quindi… / Così…","Поэтому… / И вот…"],["Alla fine…","В конце концов…"],["Finalmente!","Наконец-то!"],["Ho dovuto aspettare. / Sono dovuto andare via.","Пришлось ждать. / Пришлось уйти."]],
post:`<p>dovere, potere, volere в passato prossimo берут вспомогательный глагол от инфинитива: ho voluto vedere (vedere → avere), sono voluto andare (andare → essere). В разговоре с essere-глаголами часто говорят и с avere — это тоже допустимо.</p>`,
c:["Ieri ___ dovuto lavorare fino a tardi.",["ho","sono"],0,"lavorare идёт с avere → ho dovuto lavorare."]}
],
g31:[
{h:"Зачем congiuntivo",
pre:`<p>Congiuntivo — наклонение мнений, желаний и сомнений. В русском похоже на «чтобы»: «хочу, <b>чтобы</b> ты пришёл».</p>`,
ex:[["Voglio che tu venga.","Хочу, чтобы ты пришёл."],["Penso che sia caro.","Думаю, что это дорого."],["Spero che piaccia anche a te.","Надеюсь, тебе тоже понравится."],["È meglio che tu dorma.","Лучше тебе поспать."]],
post:`<p>После <b>penso che, credo che, spero che, voglio che, è importante che, è meglio che, bisogna che</b>. Но после <b>so che</b> (знаю, что) и <b>è vero che</b> — обычное настоящее: So che è caro.</p>`,
c:["So che la casa ___ grande.",["è","sia"],0,"so che (факт) → индикатив è."]},
{h:"Формы",
pre:`<p>Для io, tu, lui одна и та же форма, поэтому часто добавляют местоимение: che tu venga.</p>`,
ex:[["parlare → che io/tu/lui parli","-are → -i"],["prendere → che prenda","-ere → -a"],["dormire → che dorma","-ire → -a"],["capire → che capisca","-isc- сохраняется"],["noi parliamo, voi parliate","мы, вы"],["loro parlino / prendano / dormano","они"]],

read:{t:"La mia infanzia ad Almaty",text:"Da piccolo abitavo ad Almaty, in un palazzo grande con un cortile. Ogni pomeriggio giocavo a calcio con i bambini del palazzo. Non avevamo molti giocattoli, ma ci divertivamo tantissimo. La mia maestra della scuola elementare si chiamava Gulnara: era severa, però molto giusta. La sera guardavo i cartoni animati con mio fratello e la mamma ci preparava il tè con i biscotti. Ogni estate andavamo in campagna dai nonni. Lì c'erano un cane, due gatti e tante mucche. Mio nonno si alzava alle cinque e io lo aiutavo con gli animali. È il ricordo più bello della mia infanzia.",

read:{t:"Un viaggio in Puglia",text:"L'estate scorsa io e Julie siamo andati in Puglia. Volevamo partire da Catania alle sette, ma il volo per Bari è stato cancellato. Eravamo stanchi e arrabbiati, però una signora gentile ci ha spiegato che c'era un treno. Ci sono volute nove ore! Durante il viaggio abbiamo conosciuto due ragazzi di Lecce: sapevano tutto sulla regione e ci hanno dato molti consigli. A Bari abbiamo dormito in un agriturismo vicino al mare. Ogni mattina facevamo colazione in giardino e poi andavamo in spiaggia. Un giorno abbiamo preso una guida per visitare Alberobello: i trulli erano bellissimi. Non sapevo che la Puglia era così bella!",
ru:"Прошлым летом мы с Джули ездили в Апулию. Мы хотели вылететь из Катании в семь, но рейс в Бари отменили. Мы были уставшими и злыми, но одна любезная синьора объяснила нам, что есть поезд. Понадобилось девять часов! В дороге мы познакомились с двумя ребятами из Лечче: они знали всё о регионе и дали нам много советов. В Бари мы ночевали в агротуристическом гостевом доме у моря. Каждое утро мы завтракали в саду, а потом шли на пляж. Однажды мы взяли гида, чтобы посетить Альберобелло: трулли были великолепны. Я и не знал, что Апулия такая красивая!",

read:{t:"La pasta alla Norma di nonna Rosa",text:"Ciao a tutti! Oggi vi spiego la ricetta della pasta alla Norma, un primo tipico di Catania. Vi servono: mezzo chilo di pasta, due melanzane, una salsa di pomodoro, basilico e ricotta salata. Prima tagliate le melanzane a cubetti e friggetele in padella con l'olio. Non mettete troppo sale! Nel frattempo cuocete la pasta in una pentola con molta acqua. Quando è cotta, mescolatela con la salsa e le melanzane. Alla fine aggiungete il basilico e grattugiate sopra la ricotta salata. Assaggiatela subito, è buonissima calda! Un consiglio: se siete a dieta, cuocete le melanzane al forno invece di friggerle.",
ru:"Всем привет! Сегодня объясню вам рецепт пасты «алла Норма» — типичного первого блюда Катании. Вам понадобятся: полкило пасты, два баклажана, томатный соус, базилик и солёная рикотта. Сначала нарежьте баклажаны кубиками и обжарьте их на сковороде в масле. Не кладите слишком много соли! Тем временем сварите пасту в кастрюле с большим количеством воды. Когда она сварится, перемешайте её с соусом и баклажанами. В конце добавьте базилик и натрите сверху солёную рикотту. Попробуйте сразу, горячей она очень вкусная! Совет: если вы на диете, запеките баклажаны в духовке, а не жарьте.",

read:{t:"Dal medico di base",text:"In Italia, quando stai male, prima vai dal medico di base. Ogni persona che ha la tessera sanitaria ha un medico di famiglia. Di solito l'ambulatorio è aperto la mattina o il pomeriggio e la visita è gratuita. Se hai la febbre alta e non puoi uscire, il medico può venire a casa. In farmacia puoi comprare molte medicine senza ricetta, per esempio uno sciroppo per la tosse o delle pastiglie per il mal di gola. Il farmacista dà spesso buoni consigli: «Beva molta acqua, riposi e non esca con questo freddo!» Per i casi urgenti, invece, c'è il pronto soccorso dell'ospedale, aperto giorno e notte. Il numero di emergenza è il 112.",
ru:"В Италии, если тебе плохо, сначала идёшь к терапевту. У каждого, у кого есть медицинская карточка, есть семейный врач. Обычно кабинет открыт утром или днём, и приём бесплатный. Если у тебя высокая температура и ты не можешь выйти, врач может прийти на дом. В аптеке можно купить многие лекарства без рецепта, например сироп от кашля или таблетки от боли в горле. Фармацевт часто даёт хорошие советы: «Пейте много воды, отдыхайте и не выходите в такой холод!» А для срочных случаев есть приёмный покой больницы, открытый день и ночь. Номер экстренной службы — 112.",

read:{t:"Annuncio di lavoro",text:"Azienda di software di Messina cerca un data analyst per il nuovo ufficio in centro. Requisiti: laurea in informatica, statistica o economia; esperienza di almeno un anno; ottima conoscenza dell'inglese; conoscenza base dell'italiano. Offriamo: contratto a tempo pieno, stipendio adeguato all'esperienza, ventisei giorni di ferie, possibilità di lavorare da casa due giorni a settimana. Il candidato lavorerà in un piccolo team e parteciperà alle riunioni con i clienti. Se ti interessa, invia il curriculum e una lettera di presentazione entro il 30 novembre. I colloqui si faranno a dicembre, anche online.",
ru:"Компания-разработчик ПО из Мессины ищет аналитика данных в новый офис в центре. Требования: диплом по информатике, статистике или экономике; опыт от одного года; отличное знание английского; базовое знание итальянского. Мы предлагаем: договор на полный рабочий день, зарплату в соответствии с опытом, двадцать шесть дней отпуска, возможность работать из дома два дня в неделю. Кандидат будет работать в небольшой команде и участвовать во встречах с клиентами. Если тебе интересно, отправь резюме и сопроводительное письмо до 30 ноября. Собеседования пройдут в декабре, в том числе онлайн.",

{id:"a9",em:"💘",t:"Любовь с первого взгляда",ne:"Lezione 9 · Colpo di fulmine",goal:"Рассказать историю знакомства по порядку, извиниться, проявить любопытство и сожаление.",
words:["innamorarsi","il colpo di fulmine","il fidanzato","la fidanzata","sposarsi","conoscersi","lasciarsi","il bacio","geloso","il matrimonio","all'inizio","alla fine","finalmente","mentre","durante","però","quindi"],
grammar:["g30"],
read:{t:"Come ci siamo conosciuti",text:"Era una sera di maggio e pioveva. Io stavo per chiudere il computer quando la mia amica Aida mi ha chiamato: «Vieni alla festa di compleanno di Dina?» All'inizio non volevo andare, perché ero stanco, però alla fine ho detto di sì. Durante la festa ho visto una ragazza con un vestito verde che rideva con le amiche. È stato un colpo di fulmine! Mentre cercavo il coraggio di parlarle, lei mi ha chiesto: «Scusa, sai dov'è la cucina?» Abbiamo parlato tutta la sera. Purtroppo il giorno dopo lei è dovuta partire per Londra, quindi ci siamo scritti per tre mesi. Finalmente a settembre è tornata. Due anni dopo ci siamo sposati.",
ru:"Был майский вечер, шёл дождь. Я как раз собирался закрыть компьютер, когда позвонила моя подруга Аида: «Придёшь на день рождения Дины?» Сначала я не хотел идти, потому что устал, но в конце концов согласился. На празднике я увидел девушку в зелёном платье, которая смеялась с подругами. Это была любовь с первого взгляда! Пока я набирался смелости заговорить с ней, она спросила меня: «Извини, не знаешь, где кухня?» Мы проговорили весь вечер. К сожалению, на следующий день ей пришлось уехать в Лондон, поэтому мы переписывались три месяца. Наконец в сентябре она вернулась. Через два года мы поженились.",

read:{t:"Quale casa scegliamo?",text:"Yera e Julie cercano casa da un mese. Oggi l'agenzia immobiliare ha mandato due annunci. Il primo è un bilocale arredato in centro, al quarto piano senza ascensore, con un piccolo balcone. Costa 650 euro al mese. Il secondo è un trilocale non arredato vicino all'università: è più grande e luminoso, con un terrazzo e il riscaldamento autonomo, ma il quartiere è un po' rumoroso. Costa 700 euro. Julie pensa che il primo sia più comodo, perché in centro c'è tutto. Yera invece crede che sia meglio il secondo: «Penso che ci serva più spazio per studiare. E spero che il terrazzo abbia la vista sul mare!» «Magari!» ride Julie. Sabato andranno a vedere tutti e due.",

function mergeStates(a,b){

  const out=JSON.parse(JSON.stringify(n));

  ["lessons","sounds","topicsSeen","dialogs","flags","best","practice","newLog","xp"].forEach(maxMap);
  out.ach=Object.assign({},o.ach||{});for(const[x,v]of Object.entries(n.ach||{}))out.ach[x]=out.ach[x]?Math.min(out.ach[x],v):v;
  out.cards=Object.assign({},o.cards||{},n.cards||{});

  out.daily=Object.assign({},o.daily||{});for(const[d,v]of Object.entries(n.daily||{})){const r=Object.assign({},out.daily[d]||{});for(const[x,y]of Object.entries(v||{}))r[x]=Math.max(Number(y)||0,Number(r[x])||0);out.daily[d]=r}

function addXP(n){
  const t=today();
  if(state.lastDay!==t){
    const gap=state.lastDay?dayNum(t)-dayNum(state.lastDay):0;
    if(gap===1)state.streak++;
    else if(gap>1&&gap-1<=(state.freezes||0)){state.freezes-=gap-1;state.streak++;celebrate("❄️","Заморозка спасла серию","Пропущено дней: "+(gap-1)+". Серия продолжается")}
    else state.streak=1;
    if(state.streak%7===0&&(state.freezes||0)<2){state.freezes=(state.freezes||0)+1;celebrate("❄️","Новая заморозка серии","Спасёт серию, если пропустишь день")}
    state.lastDay=t;
    Object.keys(state.daily||{}).forEach(k=>{if(dayNum(t)-dayNum(k)>10)delete state.daily[k]});
  }
  const h=new Date().getHours();if(h<8)state.flags.early=1;if(h>=23)state.flags.owl=1;

}

function speak(text,slow){

  try{
    if(!("speechSynthesis" in window)){toast("Озвучка не поддерживается этим браузером");return}

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function listen(target,btn){

  if(!SR){toast("Проверка произношения работает в Chrome и Safari. Здесь можно слушать и повторять вслух.");return}
  try{

    btn.classList.add("on");
    r.onresult=e=>{
      const alts=Array.from(e.results[0]).map(a=>a.transcript);
      const t=norm(target); let best=0,heard=alts[0]||"";
      alts.forEach(a=>{const n=norm(a);const s=1-lev(n,t)/Math.max(n.length,t.length,1);if(s>best){best=s;heard=a}});
      if(best>=.8){toast("Bravo! Услышал: «"+heard+"»");addXP(1);tgHaptic("success")}
      else toast("Услышал: «"+heard+"». Послушай ещё раз и повтори.");
    };
    r.onerror=e=>toast(e.error==="not-allowed"||e.error==="service-not-allowed"?"Микрофон здесь закрыт. Открой приложение по прямой ссылке в браузере или в Telegram.":"Не расслышал, попробуй ещё раз");
    r.onend=()=>btn.classList.remove("on");

function speakU(text,opt){

    const u=new SpeechSynthesisUtterance(String(text));
    u.lang="it-IT";if(itVoice)u.voice=itVoice;u.rate=state.settings.rate;u.pitch=opt.pitch||1;
    if(opt.onend){u.onend=opt.onend;u.onerror=opt.onend}

  }catch(e){if(opt.onend)setTimeout(opt.onend,1500)}
}
function playDialog(i){
  if(!dlg||!dlg.playing)return;

    dlg.playing=false;dlg.cur=null;
    bump("dialog");if((state.dialogs[dlg.id]||0)<2){state.dialogs[dlg.id]=2;addXP(3)}else save();
    render();return;
  }
  dlg.cur=i;render();

  if(dlg.role&&l[0]===1&&!dlg.shown[i]){
    seqTimer=setTimeout(()=>{if(!dlg||!dlg.playing)return;dlg.shown[i]=true;render();speakU(l[1],{onend:()=>{seqTimer=setTimeout(()=>playDialog(i+1),350)}})},4000);
    return;
  }

}
function stopDialog(){

  const n=rnd(a,b);return{val:n,ans:String(n),say:numIt(n)};
}
function checkNum(level,inp,it){
  if(level==="price"){const v=parseFloat(inp.replace(",",".").replace(/[^\d.]/g,""));return !isNaN(v)&&Math.abs(v-it.val)<0.001}
  if(level==="time"){const m=inp.match(/(\d{1,2})\D*(\d{2})?/);if(!m)return false;return (+m[1])%12===it.h%12&&(+(m[2]||0))===it.m}
  const v=parseInt(inp.replace(/\D/g,""),10);return v===it.val;
}
function practicePool(){
  let p=WORDS.filter(w=>{const c=state.cards["w:"+w[0]];return c&&c.reps>0});
  if(p.length<12){const ex=shuffle(WORDS.filter(w=>["base","num","food","city"].includes(w[3])&&!p.includes(w)));p=p.concat(ex.slice(0,30-p.length))}
  return p;
}
function stripArt(s){return s.trim().replace(/^(l'|un')\s*/i,"").replace(/^(il|lo|la|i|gli|le|un|uno|una)\s+/i,"")}
function hardIds(){return Object.entries(state.cards).filter(([id,c])=>c.lapses>=1&&cardById(id)).sort((a,b)=>b[1].lapses-a[1].lapses).slice(0,20).map(([id])=>id)}
function startPractice(mode,level){
  let items;
  if(mode==="listen"){const pool=practicePool();items=shuffle(pool.slice()).slice(0,10).map(w=>{const others=shuffle(WORDS.filter(x=>x[1]!==w[1])).slice(0,3).map(x=>x[1]);return{w,opts:shuffle([w[1]].concat(others))}})}
  else if(mode==="write"){items=shuffle(practicePool().slice()).slice(0,10).map(w=>({w}))}
  else items=[...Array(10)].map(()=>genNum(level));
  prac={mode,level:level||null,items,i:0,correct:0,answered:null,input:"",wrong:[]};
  render();window.scrollTo(0,0);sayCurrent();
}
function sayCurrent(){
  if(!prac||!prac.items||prac.i>=prac.items.length)return;
  const it=prac.items[prac.i];
  if(prac.mode==="listen")setTimeout(()=>speak(it.w[0]),250);
  if(prac.mode==="numbers")setTimeout(()=>speak(it.say),250);
}
function answerPractice(val){
  const it=prac.items[prac.i];let ok=false,near=false;
  if(prac.mode==="listen")ok=val===it.w[1];
  else if(prac.mode==="write"){
    const a=norm(val),b=norm(it.w[0]),a2=norm(stripArt(val)),b2=norm(stripArt(it.w[0]));
    ok=a===b||a2===b2;
    if(!ok&&b2.length>4&&lev(a2,b2)===1){ok=true;near=true}
  }else ok=checkNum(prac.level,val,it);
  prac.answered={val,ok,near};comboHit(prac,ok);
  if(!prac.wrong)prac.wrong=[];
  if(ok){prac.correct++;bump("correct");addXP(2);tgHaptic("success")}
  else{
    prac.wrong.push({i:prac.i,val});
    if(it.w){const id="w:"+it.w[0],c=state.cards[id];
      if(c){c.lapses=(c.lapses||0)+1;c.due=Math.min(c.due,Date.now())}
      else state.cards[id]={ease:2.5,iv:0,reps:0,due:Date.now(),lapses:1};}
    tgHaptic("error");save();
  }
  if(prac.mode==="write"||prac.mode==="listen")speak(it.w[0]);
  render();
}

    case "pskip":answerPractice("");break;
    case "pnext":prac.i++;prac.answered=null;prac.input="";
      if(prac.i>=prac.items.length){const k=prac.mode;state.practice[k]=(state.practice[k]||0)+1;state.best[k]=Math.max(state.best[k]||0,prac.correct);bump("practice");save()}
      render();sayCurrent();break;
    case "pracHard":{const ids=(prac.wrong||[]).map(x=>"w:"+prac.items[x.i].w[0]);go("words");startSession(ids);wordsMode="session";render();break}
    case "pracRetryWrong":{const items=(prac.wrong||[]).map(x=>prac.items[x.i]);prac={mode:"numbers",level:prac.level,items,i:0,correct:0,answered:null,input:"",wrong:[]};render();sayCurrent();break}
    case "pracAgain":startPractice(prac.mode,prac.level);break;
    case "claimYes":window._claim&&window._claim(true);break;
    case "claimNo":window._claim&&window._claim(false);break;
    case "openExt":try{TG.openLink(location.href)}catch(e){}break;
    case "loginBtn":startLogin();break;
    case "loginCancel":clearInterval(loginPoll);$("#modal").classList.remove("on");break;
    case "logoutBtn":logout();break;
    case "cBack":stopSeq();hideGloss();if(cact){cact=null;act=null}else{cmod=null}render();window.scrollTo(0,0);break;
    case "cBackList":cact=null;render();break;
    case "glistBtn":cact="glist";render();window.scrollTo(0,0);break;
    case "readPlay":{const m=COURSE.find(x=>x.id===cmod);speak(m.read.text);break}
    case "readRu":act.showRu=!act.showRu;render();break;
    case "lisPlay":{const m=COURSE.find(x=>x.id===cmod);act.plays++;playLines(m.listen.lines,act.slow,()=>{});render();break}
    case "lisSlow":act.slow=!act.slow;render();break;
    case "wCheck":{const m=COURSE.find(x=>x.id===cmod),tk=m.write[act.i];let r;if(tk.k==="order")r=checkWrite(tk,act.picked.map(x=>x.w).join(" "));else{const v=($("#win")||{}).value||"";if(!v.trim()){toast("Сначала напиши ответ");break}r=checkWrite(tk,v)}
      act.a=r;if(r.ok){act.right++;bump("correct");addXP(2);tgHaptic("success")}else tgHaptic("error");speak(tk.k==="order"?tk.it:tk.ans[0]);render();break}
    case "wSkip":{const m=COURSE.find(x=>x.id===cmod);act.a={ok:false,val:""};render();break}
    case "wShow":act.a={ok:true};act.right++;addXP(2);render();break;
    case "wShowModel":act.showModel=!act.showModel;render();break;
    case "wFreeEdit":act.input=act.a.text;act.a=null;render();break;
    case "wFreeCheck":{const m=COURSE.find(x=>x.id===cmod),tk=m.write[act.i],v=(($("#wfree")||{}).value||"").trim();if(v.split(/\s+/).length<3){toast("Напиши хотя бы одно-два предложения");break}
      act.input=v;act.a={busy:true};render();const me=act;runFreeCheck(tk,v,res=>{if(act!==me)return;act.a=res;if(res.ok){if(!me.freeOk)me.freeOk={};if(!me.freeOk[me.i]){me.freeOk[me.i]=1;act.right++;bump("correct");addXP(5)}tgHaptic("success")}else tgHaptic("error");render()});break}
    case "freeWrite":openFreeWrite();break;
    case "fwCheck":{const v=(($("#fwIn")||{}).value||"").trim();if(!v){toast("Сначала напиши текст");break}const o=$("#fwOut");o.innerHTML=`<div class="muted small mt">Проверяю…</div>`;ITC.check(v).then(r=>{o.innerHTML=`<div class="card mt readtext" style="font-size:17px">${markText(v,r.errs)}</div>${errListHTML(v,r.errs)}${r.online?"":`<div class="muted small mt">Орфография онлайн недоступна, проверены грамматика и ударения.</div>`}`});break}
    case "openLvl":{const l=t.dataset.l,first=lvlMods(l)[0];modState(first.id).open=true;save();if(srvReady){clearTimeout(srvTimer);srvPush()}cmod=first.id;render();window.scrollTo(0,0);break}
    case "wNext":{const m=COURSE.find(x=>x.id===cmod);act.i++;act.a=null;act.pool=null;act.picked=null;act.input="";if(act.i>=m.write.length){modState(m.id).write=Math.max(modState(m.id).write||0,Math.round(100*act.right/m.write.length));save()}render();window.scrollTo(0,0);break}
    case "sShow":act.show=true;render();break;
    case "sNext":{const m=COURSE.find(x=>x.id===cmod);act.i++;act.show=false;addXP(1);if(act.i>=m.speak.length){modState(m.id).speak=100;save()}render();break}
    case "tType":{const m=COURSE.find(x=>x.id===cmod),q=m.test[act.i],v=(($("#tin")||{}).value||"").trim();if(!v){toast("Сначала напиши ответ");break}
      const r=checkWrite({k:"tr",ans:q.ans},v);act.a=r;if(r.ok){act.correct++;bump("correct");addXP(2);tgHaptic("success")}else{act.wrong.push({i:act.i,given:v});tgHaptic("error")}
      if(act.i===m.test.length-1)finishTest(m);render();break}
    case "tNext":{act.i++;act.a=null;act.order=null;render();window.scrollTo(0,0);setTimeout(sayTestAudio,300);break}
    case "actRestart":act=null;render();window.scrollTo(0,0);break;
    case "glossClose":hideGloss();break;
    case "glossAdd":addGlossCard(t.dataset.gw);break;
    case "trBtn":trMode="tr";openTranslator();break;
    case "trGo":doTranslate();break;
    case "trAdd":addTrCard();break;
    case "gear":openSettings();break;
    case "lvchip":case "openAwards":openAwards();break;
    case "closeM":$("#modal").classList.remove("on");render();break;
    case "auto":state.settings.autoSpeak=!state.settings.autoSpeak;t.classList.toggle("on");save();break;
    case "exportBtn":{const code=encodeState();
      $("#xfer").innerHTML=`<textarea readonly id="xcode" class="mt">${esc(code)}</textarea><div class="muted small">Если код не скопировался сам, выдели его и скопируй вручную.</div>`;
      try{navigator.clipboard.writeText(code).then(()=>toast("Код скопирован"),()=>{})}catch(err){}
      break}
    case "importBtn":$("#xfer").innerHTML=`<textarea id="xin" class="mt" placeholder="Вставь код, начинающийся с PP1:"></textarea><button class="btn block mt" id="importDo">Загрузить прогресс</button><div class="muted small">Текущий прогресс заменится прогрессом из кода.</div>`;break;
    case "importDo":{try{const o=decodeState($("#xin").value);const s0=state.settings;state=merge(o);if(!o.settings)state.settings=s0;if(uid)state.owner=uid;save();sess=null;les=null;prac=null;$("#modal").classList.remove("on");render();toast("Прогресс загружен")}catch(err){toast("Код не подошёл. Проверь, что скопирован целиком.")}break}
    case "reset":confirmReset();break;
    case "doReset":{const s=state.settings;state=DEF();state.settings=s;save();$("#modal").classList.remove("on");sess=null;les=null;prac=null;render();toast("Прогресс сброшен");break}
  }
});
document.addEventListener("click",e=>{const f=e.target.closest("#flip");if(f&&!e.target.closest("button")&&sess&&!sess.flipped){sess.flipped=true;render();if(sess.dir==="ru"&&state.settings.autoSpeak)speak(cardById(sess.cur).it)}});
document.addEventListener("focusin",e=>{if(e.target.id==="xcode")e.target.select()});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="search"){search=t.value;refocus("search",t.value)}
  if(t.id==="phSearch"){phSearch=t.value;refocus("phSearch",t.value)}
  if(t.id==="pin"&&prac)prac.input=t.value;
  if((t.id==="win"||t.id==="wfree")&&act)act.input=t.value;
  if(t.id==="rate"){state.settings.rate=+t.value;$("#rateV").textContent=(+t.value).toFixed(1)+"×"}
  if(t.id==="npd"){state.settings.newPerDay=+t.value;$("#npdV").textContent=t.value}
  if(t.id==="goal"){state.settings.goal=+t.value;$("#goalV").textContent=t.value}
});
document.addEventListener("change",e=>{if(["rate","npd","goal"].includes(e.target.id))save()});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal"&&!window._claimPending){$("#modal").classList.remove("on");render()}});
document.addEventListener("keydown",e=>{
  if(e.target.id==="tin"&&e.key==="Enter"&&act){e.preventDefault();const b=$("#tType")||$("#tNext");b&&b.click();return}
  if(e.target.id==="win"&&e.key==="Enter"&&act){e.preventDefault();const b=$("#wCheck")||$("#wNext");b&&b.click();return}
  if(e.target.id==="trIn"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();doTranslate();return}
  if(e.target.id==="pin"&&e.key==="Enter"&&prac){e.preventDefault();if(!prac.answered){const v=e.target.value;if(v.trim())answerPractice(v)}else $("#pnext")&&$("#pnext").click();return}
  if(view==="practice"&&prac&&prac.answered&&e.key==="Enter"){const n=$("#pnext");if(n){e.preventDefault();n.click()}return}
  if(view!=="words"||!sess||!sess.cur||e.target.tagName==="INPUT")return;
  if(!sess.flipped&&(e.key===" "||e.key==="Enter")){e.preventDefault();sess.flipped=true;render()}
  else if(sess.flipped&&["1","2","3","4"].includes(e.key))grade(+e.key-1);
});
window.addEventListener("hashchange",()=>{stopDialog();sub=null;les=null;dlg=null;prac=null;fromHash();render()});

fromHash();render();
setTimeout(()=>{pickVoice();if(view==="practice")render()},800);
if(TG)initTG();else if(window.claude&&typeof window.claude.use==="function")initSync();else initWeb();
</script>
</body>
</html>
